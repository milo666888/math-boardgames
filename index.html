<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數學桌遊館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=STIX+Two+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 版面：深色純色牌桌（不用漸層），紙色的卡牌與圖紙；抓鬼特工＝靛藍、畫地取寶＝酒紅。刻意只做深色一種外觀。 */
:root {
  color-scheme: dark;
  --bg: #16181d;
  --surface: #1f2229;
  --surface-2: #292d36;
  --line: #383d49;
  --text: #f0ede6;
  --text-2: #b6b2a8;
  --text-3: #888579;
  --paper: #faf7ef;
  --paper-2: #ede7d9;
  --paper-ink: #24211c;
  --paper-line: #dad2c1;
  --gold: #f2b632;
  --gold-2: #ffd98a;
  --wine: #a8222f;
  --wine-table: #2b1c20;
  --wine-line: #4a2c32;
  --indigo: #2e3577;
  --indigo-table: #1c2250;
  --indigo-line: #353f8c;
  --exp-red: #d6362f;
  --exp-green: #1f8f56;
  --trig: #1b5bb3;
  --val: #0d7a43;
  --ok: #4bcb8c;
  --bad: #ff7466;
  --p1: #4a8cff; --p2: #ff5a5f; --p3: #36c27a; --p4: #b07cff; --p5: #ff9f40; --p6: #26c0c0;
  --font-display: "Huninn", "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --font-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif;
  --font-math: "STIX Two Text", "Cambria Math", "Cambria", "Times New Roman", serif;
  --cw: clamp(58px, 7vw, 86px);
  --w-lg: clamp(92px, 13vw, 124px);
  --r: 14px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
#app { min-height: 100%; }
h1, h2, h3 { text-wrap: balance; }
button, input, select { font: inherit; }
a { color: inherit; }
.muted { color: var(--text-3); }
.eyebrow { margin: 0; font-size: .78rem; letter-spacing: .14em; color: var(--text-2); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; min-width: 0; }

/* ---------- 按鈕、選項、輸入 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.3; font-weight: 600;
  padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
  cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--text-3); }
.btn.primary { background: var(--gold); color: #2b1d00; border-color: var(--gold); }
.btn.primary:hover:not(:disabled) { background: var(--gold-2); border-color: var(--gold-2); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 12px; font-size: .86rem; }
.btn.add { border-style: dashed; }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-btn { padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
.seg-btn:hover { border-color: var(--text-3); }
.seg-btn.on { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 700; }
.seg.small .seg-btn { padding: 4px 11px; font-size: .85rem; }
input { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-width: 0; }
input:focus { border-color: var(--gold); outline: none; }
.icon-btn { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--text-2); cursor: pointer; }
.icon-btn:hover { color: var(--text); border-color: var(--text-3); }
.btn:focus-visible, .seg-btn:focus-visible, .gbtn:focus-visible, .tile:focus-visible, .icon-btn:focus-visible, .qopt:focus-visible, .pc:focus-visible { outline: 3px solid var(--gold-2); outline-offset: 2px; }

/* ---------- 大廳 ---------- */
.hub { max-width: 1160px; margin: 0 auto; padding-inline: 20px; padding-block: 30px 40px; display: grid; gap: 22px; }
.hub-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 20px; }
.hub-title { display: grid; gap: 8px; }
.hub-title h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.5rem, 7vw, 4.2rem); line-height: 1.05; letter-spacing: .06em; }
.code-in { width: 7.5em; font-family: var(--font-math); font-size: 1.3rem; letter-spacing: .25em; text-align: center; }
.code-in.big { width: 100%; font-size: 2.2rem; padding: 10px; }
.series { border-radius: 18px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.series-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; color: #fff; }
.series.s-ghost .series-head { background: var(--indigo); }
.series.s-treasure .series-head { background: var(--wine); }
.series-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.6rem, 3.6vw, 2.2rem); letter-spacing: .08em; }
.series-desc { margin: 2px 0 0; color: rgba(255,255,255,.82); font-size: .92rem; }
.series-head .btn { color: #fff; border-color: rgba(255,255,255,.45); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; padding: 16px; }
.tile {
  display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border-radius: 14px;
  text-decoration: none; color: inherit; background: var(--surface-2); border: 1px solid transparent; transition: border-color .15s, transform .15s;
}
.tile:hover { border-color: var(--gold); transform: translateY(-2px); }
.tile-art { display: flex; align-items: center; justify-content: center; min-height: 92px; }
.tile-art .pc.xs { --w: 54px; }
.tile-art .pc:first-child:not(:only-child) { transform: rotate(-8deg) translateX(7px); }
.tile-art .pc:nth-child(2) { transform: rotate(7deg) translateX(-7px); }
.tile-text { display: grid; gap: 3px; min-width: 0; }
.tile-tag { font-size: .75rem; letter-spacing: .1em; color: var(--gold-2); }
.tile-name { font-family: var(--font-display); font-size: 1.45rem; line-height: 1.2; }
.tile-blurb { font-size: .9rem; color: var(--text-2); line-height: 1.5; }
.tile-meta { font-size: .78rem; color: var(--text-3); }
.hub-foot { color: var(--text-3); font-size: .85rem; text-align: center; }
.tile-svg { width: 120px; height: auto; display: block; border-radius: 6px; }
.ts-paper { fill: var(--paper); }
.ts-grid { stroke: var(--paper-line); stroke-width: .6; }
.ts-a, .ts-b { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.ts-a { stroke: var(--p1); } .ts-b { stroke: var(--p2); }
.ts-fill { stroke: none; opacity: .2; } .ts-fill.a { fill: var(--p1); }
.ts-chest { fill: var(--gold); stroke: #6b4300; stroke-width: .8; }

/* ---------- 上方工具列 ---------- */
.game, .setup, .joinpage { min-height: 100%; display: flex; flex-direction: column; }
.gbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); color: #fff;
}
.gbar.s-ghost { background: var(--indigo); border-color: var(--indigo-line); }
.gbar.s-treasure { background: var(--wine); border-color: #7d1822; }
.gtitle { display: flex; flex-direction: column; line-height: 1.15; margin-right: auto; min-width: 0; }
.gseries { font-size: .72rem; color: rgba(255,255,255,.75); letter-spacing: .14em; }
.gtitle b { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; letter-spacing: .05em; }
.gbar-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.gbtn { background: rgba(0,0,0,.22); color: #fff; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 6px 13px; font-size: .9rem; cursor: pointer; line-height: 1.3; }
.gbtn:hover { background: rgba(0,0,0,.36); }
.roomchip { font-family: var(--font-math); font-size: 1rem; letter-spacing: .12em; padding: 4px 12px; border-radius: 999px; background: #fff; color: var(--paper-ink); font-weight: 600; }

/* ---------- 開局設定／遊戲室 ---------- */
.setup-grid { width: 100%; max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
.setup-grid.one { grid-template-columns: minmax(0, 720px); justify-content: center; }
.setup-main { display: grid; gap: 16px; }
.setup-head { display: flex; gap: 16px; align-items: center; }
.setup-head h1 { margin: 2px 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 4.5vw, 2.8rem); letter-spacing: .05em; line-height: 1.1; }
.setup-art { display: flex; flex: none; }
.setup-art .pc.xs { --w: 62px; }
.setup-art .pc:first-child:not(:only-child) { transform: rotate(-6deg); }
.setup-art .pc:nth-child(2) { transform: rotate(5deg) translateX(-10px); }
.setup-art .tile-svg { width: 150px; }
.setup-blurb { margin: 0; color: var(--text-2); max-width: 46ch; }
.setup-meta { margin: 0; color: var(--text-2); }
.options { display: grid; gap: 16px; }
.opt-row { display: grid; gap: 7px; }
.opt-label { font-size: .82rem; letter-spacing: .1em; color: var(--text-2); }
.opt-note { color: var(--text-3); font-size: .82rem; }
.opt-note.warn { color: var(--gold-2); }
.custom-row { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: .9rem; }
.num-in { width: 6em; }
.setup-seats { display: grid; gap: 14px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px; }
.panel-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; }
.panel-head small { color: var(--text-3); }
.seatlist { display: grid; gap: 8px; }
.seatrow { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); border: 1px solid transparent; }
.seatrow.kind-empty { background: transparent; border: 1px dashed var(--line); }
.seatrow.me { border-color: var(--gold); }
.seatno { width: 2.6em; height: 2.6em; border-radius: 50%; display: grid; place-items: center; background: var(--pc); color: #fff; font-weight: 700; font-size: .85rem; text-align: center; line-height: 1.1; }
.seatrow.kind-empty .seatno { background: transparent; border: 2px dashed var(--pc); color: var(--text-2); }
.seatbody { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.no-in { width: 4.2em; text-align: center; }
.name-in { flex: 1 1 8em; width: 8em; }
.seat-name { font-size: 1.02rem; }
.seat-empty { color: var(--text-3); }
.kind { font-style: normal; font-size: .76rem; padding: 2px 9px; border-radius: 999px; background: var(--surface); color: var(--text-2); }
.kind.human { color: var(--gold-2); }
.kind.online { color: var(--ok); }
.kind.offline { color: var(--bad); }
.kind.ai { color: #9fc3ff; }
.setup-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
.cta { font-size: 1.1rem; padding: 12px 30px; }
.setup-tip { margin: 0; min-height: 1.4em; color: var(--text-3); font-size: .88rem; text-align: right; }
.setup-tip.bad { color: var(--bad); }
.roompanel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.roomleft { display: grid; gap: 8px; min-width: 0; }
.roomcode span { display: block; font-size: .8rem; letter-spacing: .14em; color: var(--text-2); }
.roomcode b { font-family: var(--font-math); font-size: clamp(2.6rem, 7vw, 3.6rem); letter-spacing: .18em; line-height: 1; color: var(--gold-2); }
.roomurl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.roomurl code { font-size: .78rem; overflow-wrap: anywhere; color: var(--text-2); }
.roompanel small { color: var(--text-3); font-size: .8rem; }
.qr { width: 150px; height: 150px; padding: 8px; background: #fff; border-radius: 10px; }
.qr svg { width: 100%; height: 100%; display: block; }
.waitpanel { display: grid; gap: 14px; }
.waitpanel h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; }
.joinpage .joinform { width: min(460px, calc(100% - 32px)); margin: 40px auto; display: grid; gap: 14px; }
.joinform h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 2rem; }
.field { display: grid; gap: 4px; font-size: .85rem; color: var(--text-2); }
.field-row { display: flex; gap: 10px; }
.field.grow { flex: 1; }
.field .no-in { width: 5em; }
.join-status { margin: 0; min-height: 1.5em; color: var(--gold-2); }
.netbar { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 200; padding: 8px 16px; border-radius: 999px; background: var(--gold); color: #2b1d00; font-weight: 600; font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.4); max-width: calc(100% - 32px); }
.netbar.dead { background: var(--bad); color: #fff; }

/* ---------- 牌桌 ---------- */
.gmain { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 28px; }
.gmain.cardgame { display: flex; flex-direction: column; gap: 10px; }
.topline { display: flex; align-items: flex-start; gap: 10px; }
.seats { flex: 1; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.clock { flex: none; font-family: var(--font-math); font-variant-numeric: tabular-nums; font-size: 1.15rem; padding: 6px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.seat {
  position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 14px 10px 8px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.seat.active { border-color: var(--pc); box-shadow: 0 0 0 2px var(--pc); }
.seat.away { opacity: .75; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--pc); color: #fff; flex: none; display: grid; place-items: center; font-weight: 700; font-size: .9rem; }
.avatar.big { width: 64px; height: 64px; font-size: 1.5rem; }
.seat-text { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.seat-text b { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seat-line { font-size: .82rem; color: var(--text-2); }
.tag { font-style: normal; font-weight: 400; font-size: .7rem; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: #9fc3ff; }
.tag.warn { color: var(--gold-2); }
.dots::after { content: "…"; display: inline-block; font-style: normal; color: var(--text-2); animation: blink 1s steps(2) infinite; }
/* 每手倒數條 */
.tbar { position: absolute; left: 10px; right: 10px; bottom: 4px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; background: var(--ok); transition: width .2s linear; }
.tbar.low i { background: var(--bad); }
.tbar.none { display: none; }
.tbar.big { position: relative; left: auto; right: auto; bottom: auto; flex: 0 1 220px; width: 220px; max-width: 100%; height: 18px; border-radius: 999px; display: block; min-width: 120px; margin-left: auto; }
.tbar.big .tsec { position: absolute; inset: 0; display: grid; place-items: center; font-size: .76rem; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.tbar.big.low .tsec { color: #fff; }
.center { min-height: 200px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px; border-radius: 18px; }
.s-treasure .center { background: var(--wine-table); border: 1px solid var(--wine-line); }
.s-ghost .center { background: var(--indigo-table); border: 1px solid var(--indigo-line); }
.showcase { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
.center-side { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.pile-info { display: grid; justify-items: center; gap: 6px; }
.pile-info small, .aside small, .pile small { color: var(--text-2); font-size: .8rem; text-align: center; }
.pile-pair { display: flex; }
.pile-pair .pc + .pc { margin-left: -18px; transform: rotate(6deg); }
.pile-empty { color: var(--text-3); font-size: .85rem; padding: 10px; text-align: center; }
.aside { display: grid; justify-items: center; gap: 6px; }
.drawpick { display: grid; justify-items: center; gap: 10px; width: 100%; }
.drawpick-t { margin: 0; color: var(--gold-2); font-weight: 600; }
.drawrow { display: flex; flex-wrap: wrap; justify-content: center; padding-left: calc(var(--cw) * .35); row-gap: 10px; }
.drawrow .pc { margin-left: calc(var(--cw) * -.35); }
.pairshow { display: flex; align-items: center; gap: 12px; }
.eq { font-family: var(--font-math); font-size: 1.8rem; color: var(--gold); }
.why { margin: 0; text-align: center; font-size: 1.1rem; }
.intro-card { max-width: 460px; display: grid; gap: 6px; text-align: center; padding: 8px; }
.intro-card b { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; color: var(--gold-2); }
.intro-card p { margin: 0; }
.msg { padding: 10px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-height: 2.9em; line-height: 1.7; overflow-wrap: anywhere; }
.msg.ok { border-color: rgba(75,203,140,.6); }
.msg.bad { border-color: rgba(255,116,102,.6); }
.msg.turn { border-color: rgba(242,182,50,.6); }
.note { min-height: 0; padding: 0 4px; font-size: .95rem; }
.note:empty { display: none; }
.note .bad { color: var(--bad); }
.note.flash { animation: flash .4s ease-out; }
.me { display: grid; gap: 8px; padding: 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.me.active { border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc); }
.me-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.me-info { color: var(--text-2); font-size: .9rem; }
.hand { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; min-height: calc(var(--cw) * 1.4 + 12px); align-content: flex-start; }
.hand.bhand { min-height: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.covered { margin: 0; color: var(--text-3); padding: 18px 4px; }
.spectate { margin: 0; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line); color: var(--text-2); text-align: center; }
/* 撿紅點 */
.center.fish { grid-template-columns: auto minmax(0, 1fr) minmax(0, 210px); align-items: start; }
.pilecol { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.pile { display: grid; justify-items: center; gap: 4px; }
.flipslot { display: grid; place-items: center; }
.flip-ph { width: var(--cw); height: calc(var(--cw) * 1.4); border: 2px dashed rgba(255,255,255,.22); border-radius: calc(var(--cw) * .1); display: grid; place-items: center; color: var(--text-3); font-size: .72rem; text-align: center; padding: 4px; }
.tablewrap, .capwrap { min-width: 0; display: grid; gap: 8px; align-content: start; }
.zone-label { font-size: .78rem; letter-spacing: .12em; color: var(--text-2); }
.tablecards { display: flex; flex-wrap: wrap; gap: 8px; min-height: calc(var(--cw) * 1.4); }
.caps { display: flex; flex-wrap: wrap; gap: 4px; }
/* 急中生智 */
.center.quick { grid-template-columns: minmax(0, 1fr); }
.qstage { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; justify-content: center; }
.qcard { display: grid; place-items: center; }
.qask { display: grid; gap: 10px; flex: 1 1 320px; max-width: 480px; min-width: 0; }
.qwho { margin: 0; color: var(--gold-2); font-size: .95rem; }
.qprompt { margin: 0; font-size: 1.2rem; font-weight: 700; }
.qopts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.qopt { display: flex; align-items: center; gap: 10px; padding: 10px 14px; min-height: 66px; border-radius: 14px; border: 2px solid transparent; background: var(--paper); color: var(--paper-ink); font-size: 1.3rem; cursor: pointer; text-align: left; }
.qopt:hover:not(:disabled) { border-color: var(--gold); }
.qopt kbd { font-family: var(--font-body); font-size: .72rem; color: #6f6a5f; background: var(--paper-2); border-radius: 6px; padding: 2px 7px; }
.qopt.right { border-color: var(--ok); background: #e2f6ea; }
.qopt.wrong { border-color: var(--bad); background: #fde6e2; }
.qopt:disabled { cursor: default; }
.qopt-m { font-size: 1.15em; }

/* 極速大挑戰 */
.center.speed { grid-template-columns: minmax(0, 1fr); }
.sp-stage { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; justify-content: center; }
.sp-pile { display: grid; justify-items: center; gap: 6px; }
.sp-pile small { color: var(--text-2); }
.sp-side { display: grid; gap: 12px; flex: 1 1 320px; max-width: 500px; min-width: 0; }
.sp-cards { display: flex; gap: 16px; align-items: flex-start; flex: none; }
.sp-callcard { font-family: var(--font-math); }
.sp-num { font-size: 1.55em; color: var(--paper-ink); }
.sp-ph { width: var(--w-lg); height: calc(var(--w-lg) * 1.4); border-radius: calc(var(--w-lg) * .1); }
.sp-pad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.sp-key { justify-content: center; min-height: 58px; padding: 6px; }
.sp-key:disabled { opacity: .35; }
.slapbtn { display: grid; place-items: center; align-content: center; gap: 2px; width: 100%; min-height: calc(var(--w-lg) * 1.4); border-radius: 18px; border: 0; background: var(--bad); color: #fff; font-size: 2.2rem; font-weight: 700; cursor: pointer; font-family: var(--font-display); }
.slapbtn:hover { background: #ff8a7e; }
.slapbtn:active { transform: scale(.97); }
.slapbtn small { font-size: .78rem; font-weight: 400; opacity: .85; font-family: var(--font-body); }
.sp-slaps { display: flex; flex-wrap: wrap; gap: 6px; }
.sp-chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--pc); color: var(--text); font-size: .85rem; }
.sp-times { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.sp-times li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 12px; border-radius: 10px; background: var(--surface-2); border-left: 4px solid var(--pc); font-variant-numeric: tabular-nums; }
.sp-times li.lose { outline: 2px solid var(--bad); }
.sp-mine { display: flex; align-items: center; gap: 14px; color: var(--text-2); }

/* ---------- 數學排版 ---------- */
.mx { font-family: var(--font-math); white-space: nowrap; display: inline-flex; align-items: center; }
/* 行內算式含分數或根號時，整個算式以文字中線對齊（否則分子會落在基線上、分母掛在下方） */
.mx:has(.frac), .mx:has(.sq) { vertical-align: middle; position: relative; top: -.08em; }
.fnm { margin-right: .02em; }
.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; font-size: .88em; margin: 0 .12em; }
.fr-n { border-bottom: .075em solid currentColor; padding: 0 .14em .05em; display: inline-flex; align-items: flex-end; }
.fr-d { padding-top: .05em; }
/* 卡面與選項裡的分數：分子、分母等高，讓分數線正好落在卡片中線 */
.pc .face .fr-n, .qopt-m .fr-n, .slot-v .fr-n { min-height: 1.45em; align-items: flex-end; }
.pc .face .fr-d, .qopt-m .fr-d, .slot-v .fr-d { min-height: 1.45em; display: flex; align-items: flex-start; justify-content: center; }
.sq { display: inline-flex; align-items: stretch; vertical-align: baseline; margin-right: .05em; }
.rsvg { width: .6em; height: auto; align-self: stretch; display: block; flex: none; overflow: visible; }
.rad { border-top: .09em solid currentColor; padding: .12em .1em 0 .06em; line-height: 1.05; margin-left: -.04em; }
sup { font-size: .6em; line-height: 0; }
.chip { display: inline-flex; align-items: center; padding: 0 .45em; border-radius: .4em; vertical-align: middle; background: var(--paper); color: var(--paper-ink); font-family: var(--font-math); line-height: 1.75; }
.chip.trig { color: var(--trig); } .chip.val { color: var(--val); }
.chip.red { background: var(--exp-red); color: #fff; font-family: var(--font-display); }
.chip.green { background: var(--exp-green); color: #fff; font-family: var(--font-display); }
.chip.ghost { background: #1b2360; color: #fff; font-family: var(--font-body); }
.chip.manual { color: #6b6457; font-family: var(--font-body); }

/* ---------- 卡牌 ---------- */
.pc {
  --w: var(--cw);
  width: var(--w); height: calc(var(--w) * 1.4); border-radius: calc(var(--w) * .1); position: relative; flex: none;
  display: grid; place-items: center; font-size: calc(var(--w) * .2); background: var(--paper); color: var(--paper-ink);
  box-shadow: 0 2px 6px rgba(0,0,0,.35); user-select: none; -webkit-user-select: none; transition: transform .15s, box-shadow .15s;
}
.pc.xs { --w: 34px; }
.pc.sm { --w: clamp(48px, 4.8vw, 58px); }
.pc.lg { --w: var(--w-lg); }
.pc .cn { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: .95; font-family: var(--font-math); font-size: .8em; }
.pc .cn b { font-weight: 600; }
.pc .cn i { font-style: normal; font-size: .95em; }
.pc .cn.tl { top: .32em; left: .32em; }
.pc .cn.br { bottom: .32em; right: .32em; transform: rotate(180deg); }
.pc.red .cn { color: #c51f2e; }
.pc.black .cn { color: #1c1c21; }
.pc .face { font-family: var(--font-math); font-size: 1.02em; white-space: nowrap; letter-spacing: -.02em; }
.pc .face.trig { color: var(--trig); }
.pc .face.val { color: var(--val); font-size: 1.3em; }
.pc.manual { background: #fff; align-content: center; gap: .25em; padding: .5em; }
.pc.manual .man-t { font-family: var(--font-display); font-size: .78em; color: #7c111e; }
.pc.manual .man-l { display: block; width: 100%; height: .18em; border-radius: .1em; background: #d9d2c2; }
.pc.manual .man-l.short { width: 60%; }
.pc.gh { box-shadow: inset 0 0 0 calc(var(--w) * .045) #fff, 0 2px 6px rgba(0,0,0,.35); color: #fff; }
.pc.gh.red { background: var(--exp-red); }
.pc.gh.green { background: var(--exp-green); }
.pc.gh .gface { font-family: var(--font-display); font-size: 1.85em; line-height: 1; }
.pc.gh.len3 .gface { font-size: 1.45em; }
.pc.gh.len4 .gface { font-size: 1.15em; }
.pc.gh .gface sup { font-size: .55em; vertical-align: .9em; }
.pc.gh .gc { position: absolute; font-family: var(--font-display); font-size: .5em; line-height: 1; padding: .55em .6em; opacity: .85; }
.pc.gh .gc sup { vertical-align: .5em; }
.pc.gh .gc.tl { top: 0; left: 0; }
.pc.gh .gc.br { bottom: 0; right: 0; transform: rotate(180deg); }
.pc.gh.ghost { background: #2b2465; align-content: center; gap: .2em; }
.pc.gh.ghost .ghost-art { width: 48%; color: #fff; display: block; }
.pc.gh.ghost .ghost-art svg { width: 100%; height: auto; display: block; }
.pc.gh.ghost .ghost-t { font-family: var(--font-display); font-size: .7em; color: var(--gold-2); }
.pc.back.tr { background: #c42f3b; box-shadow: inset 0 0 0 calc(var(--w) * .05) #fff, 0 2px 6px rgba(0,0,0,.35); }
.pc.back.gh { background: #27307a; box-shadow: inset 0 0 0 calc(var(--w) * .05) #fff, 0 2px 6px rgba(0,0,0,.35); }
.pc .back-art { width: 48%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 1em; line-height: 1; }
.pc.back.tr .back-art { background: var(--gold); color: #6b1010; }
.pc.back.gh .back-art { background: #fff; color: #1b2360; }
.pc.clickable { cursor: pointer; }
.pc.clickable:hover { transform: translateY(-5px); }
.pc.sel { transform: translateY(-10px); box-shadow: 0 0 0 3px var(--gold), 0 8px 16px rgba(0,0,0,.45); }
.pc.gh.sel { box-shadow: inset 0 0 0 calc(var(--w) * .045) #fff, 0 0 0 3px var(--gold), 0 8px 16px rgba(0,0,0,.45); }
.pc.hint { animation: hint .7s ease-in-out 4; }

/* ---------- 勝者為王 ---------- */
.gmain.boardgame { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 430px); gap: 14px; align-items: start; }
.bhand-head { align-items: center; gap: 10px; flex-wrap: wrap; }
.bhand-head b { color: var(--text); }
.bhand-head .tbar.big { width: 150px; min-width: 110px; flex-basis: 150px; }
.board-wrap { position: sticky; top: 76px; background: var(--paper); border-radius: 16px; padding: 8px; min-width: 0; }
.board { display: block; width: 100%; height: auto; max-height: calc(100vh - 110px); margin: 0 auto; font-family: var(--font-body); }
.bpanel { display: grid; gap: 12px; min-width: 0; align-content: start; }
.bteams { display: grid; gap: 8px; }
.bteam { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 12px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: .88rem; color: var(--text-2); }
.bteam .avatar { width: 28px; height: 28px; font-size: .8rem; }
.bteam b { color: var(--text); font-size: 1rem; margin-right: auto; }
.bteam b small { color: var(--text-2); font-weight: 400; font-size: .8rem; }
.bteam.active { border-color: var(--pc); box-shadow: 0 0 0 2px var(--pc); }
.bteam .gold { color: var(--gold); font-weight: 700; }
.brow { display: flex; gap: 12px; align-items: center; }
.diebox { display: grid; justify-items: center; gap: 4px; flex: none; }
.diebox small { color: var(--text-2); font-size: .78rem; min-height: 1.2em; }
.die { width: 64px; height: 64px; flex: none; border-radius: 14px; background: #fffdf8; padding: 9px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 3px; box-shadow: inset 0 -4px 0 #e2d9c6, 0 4px 10px rgba(0,0,0,.35); }
.die i { border-radius: 50%; }
.die i.on { background: #2a2620; }
.die.rolling { animation: tumble .55s ease-in-out infinite; }
.die.landed { animation: land .45s cubic-bezier(.2, 1.6, .4, 1); }
.bstep { flex: 1; min-width: 0; font-size: .95rem; line-height: 1.65; }
.bstep small { display: block; color: var(--text-2); }
.bact { justify-content: flex-start; }
.bact .btn { min-height: 46px; padding-inline: 22px; font-size: 1rem; }
.move-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.move-table th, .move-table td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.move-table th { color: var(--text-2); font-weight: 500; }
.move-table td:first-child { font-family: var(--font-math); white-space: nowrap; }
.bhand-head { display: flex; justify-content: space-between; color: var(--text-2); font-size: .9rem; }
.bhand { gap: 8px; padding-top: 12px; min-height: 0; }
.board .paper-bg { fill: var(--paper); }
.board .grid line { stroke: var(--paper-line); stroke-width: .035; }
.board .region { fill: var(--pc); fill-opacity: .17; stroke: none; }
.board .region.preview { fill-opacity: .3; }
.board .edge { stroke: var(--pc); stroke-width: .11; stroke-linecap: round; }
.board .edge.closing { stroke-dasharray: .32 .2; }
.board .edge.pending { opacity: .75; }
.board .pt-dot { fill: var(--pc); stroke: #fff; stroke-width: .06; }
.board .pt.cur .pt-dot, .board .pt.cur .start-pill { stroke: #2a2620; stroke-width: .09; }
.board .pt-label { font-size: .38px; font-weight: 700; fill: #2a2620; paint-order: stroke; stroke: var(--paper); stroke-width: .1px; }
.board .start-pill { fill: var(--pc); stroke: #fff; stroke-width: .06; }
.board .start-t { font-size: .42px; font-weight: 700; fill: #fff; text-anchor: middle; }
.board .pulse { fill: none; stroke: var(--pc); stroke-width: .08; animation: pulse 1s ease-in-out infinite; }
.board .hit { fill: transparent; stroke: none; }
.board .clickable { cursor: pointer; }
.board .clickable:hover .pt-dot, .board .clickable:focus-visible .pt-dot { stroke: var(--gold); stroke-width: .12; }
.board .clickable:focus-visible { outline: none; }
.board .ghost-seg { stroke: var(--pc); stroke-width: .08; stroke-dasharray: .22 .15; opacity: .85; }
.board .ghost-seg.bad { stroke: #c93030; }
.board .ghost-pt .gp { fill: #fff; stroke: var(--pc); stroke-width: .08; }
.board .ghost-pt.ok.clickable .gp { animation: pulse 1s ease-in-out infinite; }
.board .ghost-pt.bad .gp { stroke: #c93030; }
.board .ghost-pt .gx { stroke: #c93030; stroke-width: .07; stroke-linecap: round; }
.board .chest-body { fill: #e2a52a; stroke: #6b4300; stroke-width: .045; }
.board .chest-lid { fill: #f5c650; stroke: #6b4300; stroke-width: .045; }
.board .chest-lock { fill: #6b4300; }
.board .own-ring { fill: none; stroke: var(--pc); stroke-width: .09; }

/* ---------- 對話框與結算 ---------- */
.modal-back { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: rgba(6,7,12,.72); animation: fade .18s ease-out; }
.modal { width: min(560px, 100%); max-height: calc(100% - 24px); overflow: auto; display: grid; gap: 14px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
.modal.wide { width: min(940px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.modal-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; letter-spacing: .04em; }
.modal-body { min-width: 0; }
.modal-body > p { margin: 0; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.handoff-body { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 6px 0; }
.handoff-body p { margin: 0; font-size: 1.05rem; }
.handoff .modal-actions { justify-content: center; }
.res-note { margin: 0 0 12px; color: var(--text-2); line-height: 1.7; }
.res-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.res-row { display: grid; grid-template-columns: 2.2em 36px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.res-row.top { border-color: var(--gold); }
.res-row.lose { border-color: var(--bad); }
.res-rank { font-family: var(--font-display); font-size: 1.35rem; text-align: center; color: var(--gold); }
.res-row.lose .res-rank { color: var(--bad); }
.res-name { display: grid; min-width: 0; font-weight: 700; }
.res-name small { font-weight: 400; color: var(--text-2); font-size: .82rem; line-height: 1.6; overflow-wrap: anywhere; }
.res-score { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; white-space: nowrap; }
.rules { line-height: 1.8; max-width: 70ch; }
.rules h3 { margin: 1.1em 0 .25em; font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; color: var(--gold-2); letter-spacing: .04em; }
.rules p, .rules ul, .rules ol { margin: .3em 0; }
.rules ol, .rules ul { padding-left: 1.4em; }
.rules li { margin: .25em 0; }
.rules .lead { color: var(--text-2); }
.rules .move-table { margin: .5em 0; }
.ref-body h3 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; color: var(--gold-2); }
.ref-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px; }
.tbl-wrap { overflow-x: auto; border-radius: 12px; }
table.ref { width: 100%; border-collapse: collapse; background: var(--paper); color: var(--paper-ink); font-size: .98rem; }
table.ref th, table.ref td { padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--paper-line); white-space: nowrap; }
table.ref thead th { background: var(--paper-2); font-family: var(--font-math); }
table.ref tbody th { font-family: var(--font-math); color: #5a544a; }
table.ref td.trig { color: var(--trig); }
table.ref td.val { color: var(--val); }
table.ref .suit { font-size: 1.2rem; }
table.ref .suit.red { color: #c51f2e; }
table.ref .muted { color: #9a9284; font-size: .85rem; }
.ghost-ref td.red { color: var(--exp-red); font-weight: 700; font-family: var(--font-display); }
.ghost-ref td.green { color: var(--exp-green); font-weight: 700; font-family: var(--font-display); }
.ref-note { color: var(--text-2); font-size: .86rem; margin: 8px 0 0; line-height: 1.8; }

/* ---------- 動畫 ---------- */
@keyframes hint { 0%, 100% { box-shadow: 0 2px 6px rgba(0,0,0,.35); } 50% { box-shadow: 0 0 0 5px var(--gold); transform: translateY(-6px); } }
@keyframes flash { from { opacity: .4; } to { opacity: 1; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes tumble { 0% { transform: rotate(0) translateY(0) scale(1); } 25% { transform: rotate(90deg) translateY(-14px) scale(1.08); } 50% { transform: rotate(180deg) translateY(0) scale(1); } 75% { transform: rotate(270deg) translateY(-10px) scale(1.06); } 100% { transform: rotate(360deg) translateY(0) scale(1); } }
@keyframes land { 0% { transform: scale(1.35) rotate(-12deg); } 60% { transform: scale(.94) rotate(3deg); } 100% { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 50% { opacity: .2; } }

/* ---------- 窄螢幕 ---------- */
@media (max-width: 900px) {
  .gmain.boardgame { grid-template-columns: minmax(0, 1fr); }
  /* 手機：勝者為王的按鈕固定在畫面底部，不用捲動找 */
  .gmain.boardgame:has(.bact) { padding-bottom: 84px; }
  .bact { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); justify-content: center; }
  .bact .btn { flex: 1 1 0; }
  .board-wrap { position: static; }
  .board { max-height: none; }
  .setup-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .center { grid-template-columns: minmax(0, 1fr); }
  .center.fish { grid-template-columns: auto minmax(0, 1fr); }
  .center.fish .capwrap { grid-column: 1 / -1; }
  .center-side { flex-direction: row; justify-content: center; }
  .qopts { grid-template-columns: minmax(0, 1fr); }
  .qopt { min-height: 54px; font-size: 1.15rem; }
  .gtitle b { font-size: 1.15rem; }
  .tile { grid-template-columns: 100px minmax(0, 1fr); }
  .tile-svg { width: 100px; }
  .tile-art .pc.xs { --w: 46px; }
  .roompanel { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .roomurl { justify-content: center; }
  .setup-head { flex-direction: column; align-items: flex-start; }
  .seatrow { grid-template-columns: 2.8em minmax(0, 1fr) auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
.reclaim { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--gold); color: #2b1d00; font-weight: 600; grid-column: 1 / -1; }
.reclaim .btn.primary { background: #2b1d00; color: var(--gold-2); border-color: #2b1d00; }

.opt-fixed { margin: 0; color: var(--text-2); font-size: .92rem; }
.lv-label { font-size: .8rem; color: var(--text-3); margin-left: 4px; }
.setup-rules h2 { margin: 0 0 .3em; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; }
.roompanel.err { color: var(--bad); }
.roompanel p { margin: 0; }
.hostrow { display: grid; gap: 7px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); }
.me.spec { border-style: dashed; }

/* ---------- 桌機／投影：遊戲畫面塞進一個螢幕，不上下捲動 ---------- */
@media (min-width: 900px) and (min-height: 560px) {
  :root { --cw: clamp(50px, min(7vw, 10vh), 90px); }
  #app { height: 100%; overflow: auto; }
  .game { height: 100%; overflow: hidden; }
  .game .gmain { flex: 1 1 auto; min-height: 0; padding-block: 10px 12px; }
  .gmain.cardgame .topline { flex: none; }
  .gmain.cardgame .center { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 12px 16px; }
  .gmain.cardgame .msg { flex: none; min-height: 0; padding: 7px 14px; line-height: 1.5; }
  .gmain.cardgame .note { flex: none; }
  .gmain.cardgame .me { flex: 0 1 auto; min-height: 0; max-height: 56%; display: flex; flex-direction: column; }
  .gmain.cardgame .me > * { flex: none; }
  .gmain.cardgame .hand { flex: 0 1 auto; overflow: auto; min-height: 0; padding-top: 10px; align-content: flex-start; }
  .gmain.cardgame .reclaim { flex: none; }
  .gmain.cardgame .spectate { flex: none; }
  :root { --w-lg: clamp(80px, min(11vw, 14vh), 124px); }

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
'use strict';
/* ============================================================
   數學桌遊館 · 核心工具（DOM、亂數、流程控制、幾何）
   ============================================================ */
const ABORT = Symbol('abort');     // 離開遊戲時中止所有等待
const ENDGAME = Symbol('endgame'); // 玩家提早結算

function appendKids(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false || k === true) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
}
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  appendKids(el, kids);
  return el;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, props, ...kids) {
  const el = document.createElementNS(SVGNS, tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'text') el.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    }
  }
  appendKids(el, kids);
  return el;
}

const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; }
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const fmtClock = sec => { sec = Math.max(0, sec); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; };

/* 瀏覽器儲存：只存個人偏好（動畫速度、上次選項），失敗就略過 */
const Store = {
  get(k, d) { try { const v = localStorage.getItem('mbg.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mbg.' + k, JSON.stringify(v)); } catch (e) { /* 無法儲存時略過 */ } },
};
const SPEEDS = { slow: 1.6, normal: 1, fast: 0.45 };
let SPEED_BOOST = 1;      // 示範對局放慢節奏用
const speedFactor = () => (SPEEDS[Store.get('speed', 'normal')] || 1) * SPEED_BOOST;

/* 不受背景分頁節流的計時器：瀏覽器會把背景分頁的 setTimeout 降到每分鐘一次，
   主持人若切到別的 App，遊戲會停住；Web Worker 裡的計時器不受此限制 */
const WTimer = (() => {
  let worker = null, seq = 0;
  const cbs = new Map();
  try {
    const src = 'const iv={};onmessage=e=>{const{id,ms,rep,stop}=e.data;if(stop){clearInterval(iv[id]);delete iv[id];return}if(rep){iv[id]=setInterval(()=>postMessage(id),ms)}else setTimeout(()=>postMessage(id),ms)}';
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = e => { const cb = cbs.get(e.data); if (cb) { if (!cb.rep) cbs.delete(e.data); cb.fn(); } };
  } catch (e) { worker = null; }
  return {
    set(fn, ms) { if (!worker) return { t: setTimeout(fn, ms) }; const id = ++seq; cbs.set(id, { fn }); worker.postMessage({ id, ms }); return { t: id, w: true }; },
    every(fn, ms) { if (!worker) return { t: setInterval(fn, ms), i: true }; const id = ++seq; cbs.set(id, { fn, rep: true }); worker.postMessage({ id, ms, rep: true }); return { t: id, w: true, i: true }; },
    clear(h) { if (!h) return; if (h.w) { cbs.delete(h.t); if (h.i) worker.postMessage({ id: h.t, stop: true }); } else if (h.i) clearInterval(h.t); else clearTimeout(h.t); },
  };
})();

/* 一局遊戲的生命週期：離開或重開時 kill()，所有等待中的 Promise 會以 ABORT 中止 */
class Session {
  constructor() { this.alive = true; this.timers = new Set(); this.ivals = new Set(); this.defs = new Set(); this.killers = []; }
  wait(ms, raw) {
    return new Promise((res, rej) => {
      if (!this.alive) { rej(ABORT); return; }
      const t = setTimeout(() => { this.timers.delete(t); this.alive ? res() : rej(ABORT); }, raw ? ms : ms * speedFactor());
      this.timers.add(t);
    });
  }
  defer() {
    const d = {};
    d.promise = new Promise((res, rej) => {
      d.resolve = v => { this.defs.delete(d); res(v); };
      d.reject = e => { this.defs.delete(d); rej(e); };
    });
    if (this.alive) this.defs.add(d); else d.reject(ABORT);
    return d;
  }
  every(ms, fn) { const t = setInterval(fn, ms); this.ivals.add(t); return t; }
  stop(t) { clearInterval(t); this.ivals.delete(t); }
  onkill(fn) { this.killers.push(fn); }
  kill() {
    if (!this.alive) return;
    this.alive = false;
    this.timers.forEach(clearTimeout); this.ivals.forEach(clearInterval);
    [...this.defs].forEach(d => d.reject(ABORT)); this.defs.clear();
    this.killers.forEach(fn => { try { fn(); } catch (e) { /* ignore */ } });
  }
}

/* 玩家 */
const PLAYER_COLORS = ['var(--p1)', 'var(--p2)', 'var(--p3)', 'var(--p4)', 'var(--p5)', 'var(--p6)'];
const AI_NAMES = ['小安', '阿哲', '小晴', '阿凱', '小米'];
function makePlayers(n, humans = 1) {
  return range(0, n - 1).map(i => {
    const human = i < humans;
    const solo = humans === 1;
    const name = human ? (solo ? '你' : `玩家${i + 1}`) : AI_NAMES[i - humans];
    const initial = human ? (solo ? '你' : String(i + 1)) : name.slice(-1);
    return { idx: i, name, human, color: PLAYER_COLORS[i], initial };
  });
}
/* 訊息中的稱呼：單人模式的真人叫「你」 */
const nameOf = p => (p.name === '你' ? '你' : p.name);

/* ============================================================
   幾何：線段相交、點在多邊形內
   ============================================================ */
const V = {
  sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  cross: (a, b) => a.x * b.y - a.y * b.x,
  dot: (a, b) => a.x * b.x + a.y * b.y,
  dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
};
const near = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) < 1e-6;
function polar(r, deg) { const t = deg * Math.PI / 180; return { x: r * Math.cos(t), y: r * Math.sin(t) }; }

/* 回傳 null（不相交）、{type:'point', p}、或 {type:'overlap'}（共線重疊） */
function segInter(a, b, c, d) {
  const r = V.sub(b, a), s = V.sub(d, c), qp = V.sub(c, a);
  const rxs = V.cross(r, s), qpxr = V.cross(qp, r);
  const lr = Math.hypot(r.x, r.y), ls = Math.hypot(s.x, s.y);
  if (Math.abs(rxs) <= 1e-9 * lr * ls) {
    if (Math.abs(qpxr) > 1e-7 * lr) return null;
    const rr = V.dot(r, r);
    const t0 = V.dot(qp, r) / rr, t1 = t0 + V.dot(s, r) / rr;
    const lo = Math.max(0, Math.min(t0, t1)), hi = Math.min(1, Math.max(t0, t1));
    if (hi < lo - 1e-9) return null;
    if ((hi - lo) * lr > 1e-6) return { type: 'overlap' };
    const t = (lo + hi) / 2;
    return { type: 'point', p: { x: a.x + r.x * t, y: a.y + r.y * t } };
  }
  const t = V.cross(qp, s) / rxs, u = qpxr / rxs;
  if (t < -1e-9 || t > 1 + 1e-9 || u < -1e-9 || u > 1 + 1e-9) return null;
  return { type: 'point', p: { x: a.x + r.x * t, y: a.y + r.y * t } };
}
function distPointSeg(p, a, b) {
  const ab = V.sub(b, a), len2 = V.dot(ab, ab);
  if (len2 === 0) return V.dist(p, a);
  const t = clamp(V.dot(V.sub(p, a), ab) / len2, 0, 1);
  return Math.hypot(p.x - (a.x + ab.x * t), p.y - (a.y + ab.y * t));
}
/* 線段 AB 是否「乾淨」：不與 segs 中任何線段相交（只允許在共同端點相接），也不經過 points 中的其他點 */
function segClear(A, B, segs, points) {
  for (const [P, Q] of segs) {
    const it = segInter(A, B, P, Q);
    if (!it) continue;

/* ============================================================

function modal({ title, body, actions = [], wide = false, dismissible = true, cls = '' }) {
  const back = h('div', { class: 'modal-back' });
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape' && dismissible) close(); };
  const btns = actions.map(a => h('button', {
    class: 'btn' + (a.primary ? ' primary' : '') + (a.ghost ? ' ghost' : ''),
    onclick: () => { if (!a.keepOpen) close(); if (a.onClick) a.onClick(); },
  }, a.label));
  const box = h('div', { class: `modal${wide ? ' wide' : ''} ${cls}`, role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('div', { class: 'modal-head' }, h('h2', {}, title),
      dismissible ? h('button', { class: 'icon-btn', 'aria-label': '關閉', onclick: close }, '✕') : null),
    h('div', { class: 'modal-body' }, body),
    btns.length ? h('div', { class: 'modal-actions' }, btns) : null);
  back.append(box);
  document.body.append(back);
  document.addEventListener('keydown', onKey);
  if (dismissible) back.addEventListener('click', e => { if (e.target === back) close(); });
  const first = box.querySelector('.modal-actions .primary');
  if (first) setTimeout(() => first.focus({ preventScroll: true }), 30);   // 長內容（規則）打開時要從頂端開始看
  return { close, box };
}

    actions: [{ label: '關閉', primary: true }],

'use strict';
/* ============================================================
   對局引擎
   - 每個遊戲是一個「規則定義」：init / act / ai / timeout / step / render
   - 房主（或單機）裝置上的 HostRunner 持有唯一的對局狀態，處理所有出手、
     電腦玩家與每手計時，每次狀態改變就發佈整份狀態給所有畫面
   - 每個畫面（GameView）只依狀態重畫，出手時送出動作
   ============================================================ */
const GAMES = {};          // id → 遊戲規則定義
const defineGame = def => { GAMES[def.id] = def; return def; };

const LEVELS = { easy: '簡單', normal: '普通', hard: '困難' };
/* 座位：{ name, no, ai, level, cid, local } → 對局中的座位資料 */
function makeSeats(list) {
  let ai = 0;
  return list.map((s, i) => {
    const name = s.ai ? (s.name || AI_NAMES[ai++ % AI_NAMES.length]) : (s.name || (s.no ? '' : `玩家${i + 1}`));
    return {
      name, no: s.no || '', cls: s.cls || '', ai: !!s.ai, level: s.level || 'normal', cid: s.cid || null, local: !!s.local,
      away: false, color: PLAYER_COLORS[i], initial: s.ai ? name.slice(-1) : (s.no ? String(s.no).slice(-2) : name.slice(-1)),
    };
  });
}
const seatLabel = st => (st.no ? `${st.no}號${st.name ? ' ' + st.name : ''}` : st.name);
const isBot = st => st.ai || st.away;

/* 對局狀態共用小工具 */
function sayS(s, html, kind = '') { s.msgSeq = (s.msgSeq || 0) + 1; s.msg = { html, kind, n: s.msgSeq }; }
const waitOf = (s, seat) => s.wait.find(w => w.seat === seat);
function nextSeat(s, from, ok) {
  const n = s.seats.length;
  for (let k = 1; k <= n; k++) { const j = (from + k) % n; if (ok(j)) return j; }
  return -1;
}

/* ---------------- 房主端：唯一的規則判定者 ---------------- */
class HostRunner {
  constructor(def, cfg, onPublish, restore = null) {
    this.def = def;
    this.onPublish = onPublish;
    this.alive = true;
    this.timers = new Map();
    this.waitSeq = 0;
    this.misses = {};         // 每個座位連續逾時的次數
    this.running = false;
    this.again = false;
    this.clockT = null;
    this.pendingAuto = null;
    if (restore && restore.state) {
      /* 主持人重新整理後接續：沿用存下來的牌局，等待中的步驟重新計時 */
      const s = this.state = JSON.parse(JSON.stringify(restore.state));
      s.busy = null; s.thinking = null;
      if (restore.pendingAuto && !s.auto && !s.over) s.auto = restore.pendingAuto;
      s.wait.forEach(w => { delete w.deadline; delete w.remain; delete w.total; });
      this.waitSeq = Math.max(0, ...s.wait.map(w => w.id || 0)) + 1000;
      return;
    }
    this.state = def.init(cfg);
    Object.assign(this.state, { game: def.id, limit: +cfg.limit || 0, wait: this.state.wait || [], seq: 0 });
    /* 整局時間上限：每款遊戲都有，時間到就結算 */
    const mins = +(cfg.opts && cfg.opts.time) || 0;
    if (mins && !this.state.clockEnd) this.state.clockEnd = Date.now() + mins * 60000;
  }
  sleep(ms) { return new Promise(res => WTimer.set(res, ms * speedFactor())); }
  isBot(seat) { return isBot(this.state.seats[seat]); }
  limitMs(w) {
    if (this.def.limitMs) { const v = this.def.limitMs(this.state, w); if (v != null) return v; }
    return this.state.limit * 1000;
  }
  publish() {
    const s = this.state, now = Date.now();
    s.seq++;
    s.wait.forEach(w => { if (!w.id) w.id = ++this.waitSeq; w.remain = w.deadline ? Math.max(0, w.deadline - now) : null; });
    if (s.clockEnd) s.clockRemain = Math.max(0, s.clockEnd - now);
    this.onPublish(JSON.parse(JSON.stringify(s)));
  }
  start() {
    const s = this.state;
    if (s.clockEnd) this.clockT = WTimer.set(() => this.onClock(), Math.max(0, s.clockEnd - Date.now()));
    this.kick();
  }
  onClock() {
    const s = this.state;
    if (!this.alive || s.over) return;
    if (this.def.finish) this.def.finish(s, '時間到！'); else s.over = true;
    this.kick();
  }
  stop() { this.alive = false; this.stopTimers(); WTimer.clear(this.clockT); }
  kick() {
    if (!this.alive) return;
    if (this.running) { this.again = true; return; }
    this.running = true;
    this.loop().catch(e => { console.error(e); }).finally(() => {
      this.running = false;
      if (this.again && this.alive) { this.again = false; this.kick(); }
    });
  }
  async loop() {
    while (this.alive) {
      const s = this.state;
      if (s.over) { this.stopTimers(); this.publish(); return; }
      if (s.hold) { const ms = s.hold; s.hold = 0; this.publish(); await this.sleep(ms); continue; }
      if (s.auto) {
        const a = s.auto; s.auto = null; s.busy = a.kind;
        this.pendingAuto = a;     // 存檔用：重新整理後要接著做這一步
        this.publish();
        await this.sleep(a.delay || 0);
        if (!this.alive) return;
        s.busy = null; this.pendingAuto = null;
        this.def.step(s, a);
        continue;
      }
      s.wait.forEach(w => { if (!w.id) w.id = ++this.waitSeq; });
      /* live：多人同時出手的等待（例如搶拍），電腦各自計時、不排隊 */
      const bot = s.wait.find(w => this.isBot(w.seat) && !w.live);
      if (bot) {
        s.thinking = bot.seat;
        this.publish();
        await this.sleep(this.def.thinkMs ? this.def.thinkMs(s, bot) : 900);
        if (!this.alive) return;
        s.thinking = null;
        if (!s.wait.includes(bot)) continue;
        let r = this.def.act(s, bot.seat, this.def.ai(s, bot.seat, bot), bot, { bot: true });
        if (r && r.err) { console.warn('電腦出手失敗：', r.err); this.def.act(s, bot.seat, this.def.timeout(s, bot.seat, bot), bot, { timeout: true, bot: true }); }
        continue;
      }
      for (const w of s.wait) {
        if (this.timers.has(w.id)) continue;
        if (w.live && this.isBot(w.seat)) {
          const ms = this.def.thinkMs ? this.def.thinkMs(s, w) : 900;
          this.timers.set(w.id, this.schedule(() => this.onLiveBot(w), ms));
          continue;
        }
        const ms = this.limitMs(w);
        if (ms > 0) {
          w.deadline = Date.now() + ms; w.total = ms;
          this.timers.set(w.id, WTimer.set(() => this.onTimeout(w), ms));
        } else this.timers.set(w.id, null);
      }
      for (const [id, t] of this.timers) if (!s.wait.some(w => w.id === id)) { WTimer.clear(t); this.timers.delete(id); }
      this.publish();
      return;
    }
  }
  schedule(fn, ms) { return WTimer.set(fn, ms * speedFactor()); }
  stopTimers() { this.timers.forEach(t => WTimer.clear(t)); this.timers.clear(); }
  onLiveBot(w) {
    const s = this.state;
    this.timers.delete(w.id);
    if (!this.alive || s.over || !s.wait.includes(w)) return;
    const r = this.def.act(s, w.seat, this.def.ai(s, w.seat, w), w, { bot: true });
    if (r && r.err) console.warn('電腦出手失敗：', r.err);
    this.kick();
  }
  onTimeout(w) {
    const s = this.state;
    this.timers.delete(w.id);
    if (!this.alive || s.over || !s.wait.includes(w)) return;
    this.def.act(s, w.seat, this.def.timeout(s, w.seat, w), w, { timeout: true });
    /* 連續兩手逾時：先由電腦代打，本人按「我回來了」可以接回 */
    const st = s.seats[w.seat];
    if (!st.ai && !st.away && !w.optional) {
      this.misses[w.seat] = (this.misses[w.seat] || 0) + 1;
      if (this.misses[w.seat] >= 2) {
        st.away = true; st.idle = true;
        sayS(s, `${seatLabel(st)} 連續兩手沒有出手，先由電腦代打；本人按「我回來了」就能接回。`, 'bad');
      }
    }
    this.kick();
  }
  reclaim(seat) {
    const st = this.state.seats[seat];
    if (!st || !st.idle) return;
    st.away = false; st.idle = false; this.misses[seat] = 0;
    sayS(this.state, `${seatLabel(st)} 回來了，接回自己的座位。`, 'ok');
    this.kick();
  }
  /* 真人出手（本機或遠端） */
  submit(seat, action) {
    const s = this.state;
    if (s.over) return { err: '這一局已經結束了。' };
    const w = waitOf(s, seat);
    if (!w) return { err: '還沒輪到你。' };
    if (s.auto || s.busy) return { err: '請稍等，畫面還在更新。' };
    const r = this.def.act(s, seat, action, w, {}) || {};
    if (r.err) return r;
    this.misses[seat] = 0;
    this.kick();
    return { ok: true };
  }
  /* 有人斷線：電腦代打；重新連上：還給本人 */
  setAway(seat, away) {
    const st = this.state.seats[seat];
    if (!st || st.ai || (st.away === away && !st.idle)) return;
    st.away = away; st.idle = false; this.misses[seat] = 0;
    sayS(this.state, away ? `${seatLabel(st)} 離線了，先由電腦代打。` : `${seatLabel(st)} 回來了！`, away ? 'bad' : 'ok');
    this.kick();
  }
  endNow() {
    if (this.state.over) return;
    if (this.def.finish) this.def.finish(this.state, '主持人提早結算。');
    this.kick();
  }
}

/* ---------------- 畫面端：依狀態重畫 ---------------- */
class GameView {
  /* opts: { mySeat, send(action) → Promise<{err}|ok>, spectate, ... }；一台裝置一位玩家 */
  constructor(def, root, opts) {
    this.def = def;
    this.root = root;
    this.o = opts;
    this.seat = opts.mySeat;
    this.ui = {};
    this.uiKey = null;
    this.deadlines = new Map();
    this.state = null;
    this.noteHTML = '';
    this.tick = setInterval(() => this.updateTimers(), 200);
    this.onKey = null;
    this.keyListener = e => { if (this.onKey && !e.repeat && !document.querySelector('.modal-back')) this.onKey(e); };
    document.addEventListener('keydown', this.keyListener);
  }
  destroy() { clearInterval(this.tick); if (this.rollTimer) clearInterval(this.rollTimer); document.removeEventListener('keydown', this.keyListener); }
  update(s) {
    this.state = s;
    /* 主持人只主持不玩：跟著輪到的人看他的畫面 */
    if (this.o.spectate) { const w0 = s.wait[0]; if (w0) this.seat = w0.seat; else if (this.seat == null) this.seat = 0; }
    const now = performance.now();
    s.wait.forEach(w => { if (w.remain != null) this.deadlines.set(w.id, { end: now + w.remain, total: w.total || w.remain }); });
    const w = s.wait.find(x => x.seat === this.seat);
    const key = w ? `${w.id}` : `none-${s.phase}`;
    const fresh = key !== this.uiKey;
    if (fresh) { this.uiKey = key; this.ui = {}; this.noteHTML = ''; }
    this.render();
    if (fresh && w && !this.o.spectate && !s.over) this.autoFocus();
  }
  /* 小螢幕會捲動：輪到自己時把要操作的地方捲到眼前（大螢幕整個畫面放得下，不用捲） */
  autoFocus() {
    if (innerWidth >= 900 && innerHeight >= 560) return;
    const el = this.root.querySelector('.autofocus') || this.root.querySelector('.center, .board');
    if (!el) return;
    const bar = document.querySelector('.gbar');
    const hdr = bar && getComputedStyle(bar).position === 'sticky' ? bar.offsetHeight : 0;
    const top = el.getBoundingClientRect().top;
    if (top >= hdr && top <= innerHeight * 0.45) return;
    window.scrollTo(0, Math.max(0, window.scrollY + top - hdr - 8));
  }
  render() {
    if (!this.state) return;
    this.onKey = null;
    this.def.render(this.state, this);
    const st = this.seat != null ? this.state.seats[this.seat] : null;
    if (st && st.idle && !this.state.over && this.o.reclaim) {
      this.root.prepend(h('div', { class: 'reclaim', role: 'alert' },
        h('span', {}, '你連續兩手沒有出手，現在由電腦代打。'),
        h('button', { class: 'btn primary small', onclick: () => this.o.reclaim(this.seat) }, '我回來了')));
    }
  }
  myWait() { return this.state && !this.o.spectate ? this.state.wait.find(x => x.seat === this.seat) : null; }
  /* 送出動作；錯誤只顯示在自己畫面 */
  async send(action) {
    const r = await this.o.send(this.seat, action);
    if (r && r.err) this.note('✗ ' + r.err, 'bad');
  }
  note(html, kind = '') {
    this.noteHTML = html ? `<span class="${kind}">${html}</span>` : '';
    const el = this.root.querySelector('.note');
    if (el) { el.innerHTML = this.noteHTML; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }
  timerBar(w, big) {
    const bar = h('span', { class: 'tbar' + (big ? ' big' : ''), 'data-wid': String(w.id) }, h('i'));
    if (big) bar.append(h('b', { class: 'tsec' }));
    return bar;
  }
  updateTimers() {
    const now = performance.now();
    this.root.querySelectorAll('.tbar[data-wid]').forEach(el => {
      const d = this.deadlines.get(+el.dataset.wid);
      if (!d) { el.classList.add('none'); return; }
      const left = Math.max(0, d.end - now);
      const f = d.total ? left / d.total : 0;
      el.firstChild.style.width = `${f * 100}%`;
      el.classList.toggle('low', left < 5000);
      const sec = el.querySelector('.tsec');
      if (sec) sec.textContent = `${Math.ceil(left / 1000)} 秒`;
    });
    /* 本局剩餘時間：顯示在上方標題列、房號左邊 */
    const ck = document.querySelector('.gbar .gclock');
    if (ck) {
      const s = this.state, on = !!s && s.clockRemain != null && !s.over;
      ck.hidden = !on;
      if (on) {
        if (ck.dataset.seq !== String(s.seq)) { ck.dataset.seq = String(s.seq); ck.dataset.end = String(now + s.clockRemain); }
        const left = Math.ceil((+ck.dataset.end - now) / 1000);
        ck.lastChild.textContent = fmtClock(Math.max(0, left));
        ck.classList.toggle('low', left <= 60);
      }
    }
  }
}

'use strict';
/* ============================================================
   線上遊戲室：WebRTC 點對點（PeerJS）
   房主的裝置就是伺服器：其他人用房號連到房主，不需要資料庫。
   PeerJS 的公開配對服務只負責牽線，牌局資料直接在裝置之間傳送。
   ============================================================ */
const NET_PREFIX = 'twmathbg-room-';
const NET = {
  /* 只有放在網站上（http/https）且載入了 PeerJS 才能連線；Claude Artifact 內不提供 */
  available: () => typeof Peer !== 'undefined' && /^https?:$/.test(location.protocol) && !window.claude,
  /* 每個分頁一個識別碼（重新整理仍相同，斷線重連時可以回到原座位） */
  myCid() {
    let id = null;
    try { id = sessionStorage.getItem('mbg.cid'); } catch (e) { /* 略過 */ }
    if (!id) {
      id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
      try { sessionStorage.setItem('mbg.cid', id); } catch (e) { /* 略過 */ }
      NET.cidMem = NET.cidMem || id;
      return NET.cidMem;
    }
    return id;
  },
  joinURL: code => `${location.origin}${location.pathname}?room=${code}`,
};
const PEER_OPTS = { debug: 0 };

/* 房主：開房、收連線、廣播 */
class RoomHost {
  constructor(handlers) {
    this.h = handlers;           // { onHello(conn, msg), onAct(conn, msg), onGone(conn), onStatus(text) }
    this.conns = new Set();
    this.peer = null;
    this.code = null;
    this.closed = false;
    this.beat = null;
  }
  /* fixed：主持人重新整理後用原本的房號重開（舊連線釋放前會被占用，所以多試幾次） */
  open(tries = 0, fixed = null) {
    return new Promise((resolve, reject) => {
      const code = fixed || String(1000 + rand(9000));
      const peer = new Peer(NET_PREFIX + code, PEER_OPTS);
      let settled = false;
      peer.on('open', () => {
        settled = true;
        this.peer = peer; this.code = code;
        peer.on('connection', conn => this.accept(conn));
        peer.on('disconnected', () => { if (!this.closed) { this.h.onStatus && this.h.onStatus('與配對服務暫時斷線，重新連線中…'); try { peer.reconnect(); } catch (e) { /* 略過 */ } } });
        this.beat = WTimer.every(() => this.checkAlive(), 3000);
        resolve(code);
      });
      peer.on('error', err => {
        if (!settled) {
          settled = true;
          try { peer.destroy(); } catch (e) { /* 略過 */ }
          if (err.type === 'unavailable-id' && fixed && tries < 25) setTimeout(() => this.open(tries + 1, fixed).then(resolve, reject), 2500);
          else if (err.type === 'unavailable-id' && fixed) this.open(0, null).then(resolve, reject);   // 原房號一直被占用：改開新房號
          else if (err.type === 'unavailable-id' && tries < 6) this.open(tries + 1).then(resolve, reject);
          else reject(err);
        } else if (this.h.onStatus) this.h.onStatus('連線發生問題：' + (err.type || err.message));
      });
    });
  }
  accept(conn) {
    conn.lastSeen = Date.now();
    conn.on('open', () => { this.conns.add(conn); });
    conn.on('data', msg => {
      conn.lastSeen = Date.now();
      if (!msg || typeof msg !== 'object') return;
      if (msg.t === 'hello') this.h.onHello(conn, msg);
      else if (msg.t === 'act') this.h.onAct(conn, msg);
      else if (msg.t === 'back') this.h.onBack(conn);
      else if (msg.t === 'bye') this.drop(conn);
    });
    conn.on('close', () => this.drop(conn));
    conn.on('error', () => this.drop(conn));
  }
  drop(conn) {
    if (!this.conns.has(conn)) return;
    this.conns.delete(conn);
    try { conn.close(); } catch (e) { /* 略過 */ }
    this.h.onGone(conn);
  }
  checkAlive() {
    const now = Date.now();
    for (const c of [...this.conns]) {
      if (now - c.lastSeen > 20000) this.drop(c);
      else this.send(c, { t: 'ping' });
    }
  }
  send(conn, msg) { try { if (conn.open) conn.send(msg); } catch (e) { /* 略過 */ } }
  broadcast(msg) { for (const c of this.conns) this.send(c, msg); }
  /* silent：不是主持人按「結束」，只是離開畫面 → 不通知玩家遊戲室關閉，讓他們等主持人回來 */
  close(silent = false) {
    if (this.closed) return;
    this.closed = true;
    WTimer.clear(this.beat);
    if (!silent) this.broadcast({ t: 'closed' });
    setTimeout(() => { try { this.peer && this.peer.destroy(); } catch (e) { /* 略過 */ } }, silent ? 0 : 300);
  }
}

/* 加入者：連到房主、送出動作、斷線自動重連 */
class RoomClient {
  constructor(code, hello, handlers) {
    this.code = code;
    this.hello = hello;          // { name, no, cls }
    this.h = handlers;           // { onMsg(msg), onStatus(state, text) }
    this.peer = null;
    this.conn = null;
    this.closed = false;
    this.lastSeen = 0;
    this.retry = 0;
    this.beat = null;
  }
  start() {
    return new Promise((resolve, reject) => {
      this.peer = new Peer(PEER_OPTS);
      let first = true;
      const fail = text => { if (first) { first = false; reject(new Error(text)); } };
      this.peer.on('open', () => this.connect(() => { if (first) { first = false; resolve(); } }, fail));
      this.peer.on('error', err => {
        if (err.type === 'peer-unavailable') fail(`找不到房號 ${this.code} 的遊戲室，請確認房號，或請主持人重新開房。`);
        else if (first) fail('連線失敗：' + (err.type || err.message));
        else this.h.onStatus('error', '連線發生問題，重新連線中…');
      });
      setTimeout(() => fail('連線逾時。請確認房號，並確定主持人的畫面還開著。'), 15000);
    });
  }
  connect(onOpen, onFail) {
    if (this.closed) return;
    const conn = this.peer.connect(NET_PREFIX + this.code, { reliable: true });
    this.conn = conn;
    conn.on('open', () => {
      this.retry = 0; this.lastSeen = Date.now();
      conn.send({ t: 'hello', cid: NET.myCid(), name: this.hello.name, no: this.hello.no, cls: this.hello.cls || '' });
      this.h.onStatus('ok', '');
      WTimer.clear(this.beat);
      this.beat = WTimer.every(() => {
        if (Date.now() - this.lastSeen > 20000) { this.h.onStatus('lost', '和主持人的連線中斷，自動重新連線中…'); this.reconnect(); }
        else this.send({ t: 'ping' });
      }, 3000);
      onOpen && onOpen();
    });
    conn.on('data', msg => { this.lastSeen = Date.now(); if (msg && msg.t !== 'ping') this.h.onMsg(msg); });
    conn.on('close', () => { if (!this.closed) { this.h.onStatus('lost', '和主持人的連線中斷，重新連線中…'); this.reconnect(); } });
    conn.on('error', () => onFail && onFail('連不上主持人的裝置。'));
  }
  reconnect() {
    if (this.closed || this.reconnecting) return;
    this.reconnecting = true;
    WTimer.clear(this.beat);
    this.retry++;
    setTimeout(() => {
      this.reconnecting = false;
      if (this.closed) return;
      if (this.retry > 60) { this.h.onStatus('dead', '一直連不上主持人，請回首頁按「回到遊戲室」再試一次。'); return; }
      try { if (this.peer.disconnected) this.peer.reconnect(); } catch (e) { /* 略過 */ }
      this.connect();
    }, Math.min(1500 + this.retry * 500, 4000));   // 主持人重新整理時，約 3 分鐘內都會自動連回
  }
  send(msg) { try { if (this.conn && this.conn.open) { this.conn.send(msg); return true; } } catch (e) { /* 略過 */ } return false; }
  close() {
    this.closed = true;
    WTimer.clear(this.beat);
    this.send({ t: 'bye' });
    setTimeout(() => { try { this.peer && this.peer.destroy(); } catch (e) { /* 略過 */ } }, 300);
  }
}

/* QR code（qrcode-generator 函式庫；沒有載入時顯示網址文字） */
function qrSVG(text) {
  if (typeof qrcode === 'undefined') return null;
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const wrap = h('div', { class: 'qr', html: qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) });
  return wrap;
}

'use strict';
/* ============================================================

/* 卡牌類遊戲的版面 */

/* 一排卡牌（以 id 表示） */
function cardsEls(ids, o = {}) {

  return ids.map(id => cardEl(C(id), {

function btnEl(a) {

}
/* 結算畫面（每個畫面各自顯示一次） */
function showOver(v, s) {
  if (v.shownOver === s.seq || v.shownOverDone) return;
  v.shownOverDone = true;
  const r = s.result;
  const body = h('div', { class: 'results' },
    r.note ? h('p', { class: 'res-note', html: r.note }) : null,

      const st = s.seats[row.seat];
      return h('li', { class: 'res-row' + (row.top ? ' top' : '') + (row.lose ? ' lose' : ''), style: `--pc:${st.color}` },
        h('span', { class: 'res-rank' }, row.rank),
