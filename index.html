/* 依分數排名（同分同名次）：回傳 [{seat, rank, top}] */
function rankSeats(n, scoreOf, desc = true) {
  const list = range(0, n - 1).sort((a, b) => (desc ? scoreOf(b) - scoreOf(a) : scoreOf(a) - scoreOf(b)));
  let last = null, rank = 0;
  return list.map((seat, i) => { const sc = scoreOf(seat); if (sc !== last) { rank = i + 1; last = sc; } return { seat, rank, top: rank === 1 }; });
}
function winnerTitle(s, ranked) {
  const tops = ranked.filter(r => r.top).map(r => s.seats[r.seat]);
  return tops.length > 1 ? `${tops.map(seatLabel).join('、')} 並列第一` : `${seatLabel(tops[0])} 獲勝！`;
}

'use strict';
/* ============================================================
   抽鬼牌類：抓鬼特工（紅配綠）、抽卡PK賽（數值相同）
   節奏：輪流抽牌（有限時），抽完立刻換下一位；配對隨時可以出，
   只有「正被抽牌的人」這段時間不能出。輪到自己抽牌時可以先出對子再抽
  （兩人局每一輪都是一個抽、一個被抽，若抽牌者也不能出，就永遠丟不出去）；
   抽完另給 5 秒出對子（不論有沒有對子都給，才不會變成提示），再換下一位
   ============================================================ */
function oldMaidDef(k) {
  const pairOK = (a, b) => k.canPair(C(a), C(b));
  const findPair = hand => {
    for (let i = 0; i < hand.length; i++) for (let j = i + 1; j < hand.length; j++) if (pairOK(hand[i], hand[j])) return [hand[i], hand[j]];
    return null;
  };
  const L = (s, i) => seatLabel(s.seats[i]);
  function pairUp(s, seat, a, b) {
    s.hands[seat] = s.hands[seat].filter(x => x !== a && x !== b);
    s.pairs[seat]++; s.total++;
    s.lastPair = [a, b];
    s.show = { type: 'pair', seat, a, b };
  }
  function autoAll(s, seat) { let pr; while ((pr = findPair(s.hands[seat]))) pairUp(s, seat, ...pr); }
  function overReason(s) {
    if (s.clockEnd && Date.now() >= s.clockEnd) return '時間到！';
    if (s.stalled) return '連續 3 輪都沒有人配對成功，遊戲結束。';
    if (k.endWhenAnyEmpty) return s.hands.some(x => !x.length) ? '有人手牌出清，遊戲結束。' : null;
    return s.hands.filter(x => x.length).length <= 1 ? '場上只剩下鬼牌，遊戲結束。' : null;
  }
  function finish(s, reason) {
    s.over = true; s.phase = 'over'; s.wait = []; s.auto = null;
    const loser = s.hands.findIndex(x => x.includes(k.loser));
    const order = range(0, s.seats.length - 1).sort((a, b) => (a === loser) - (b === loser) || s.hands[a].length - s.hands[b].length || s.pairs[b] - s.pairs[a]);
    let note = `${reason || ''}${L(s, loser)} 手上留著${k.loserName}。`;
    if (s.aside) note += `<br>開局抽出、不使用的牌是 ${cardInline(C(s.aside))}。`;
    s.result = {
      title: `${L(s, loser)} 留下${k.loserName}`, note,
      rows: order.map(seat => ({
        seat, rank: seat === loser ? '輸' : '✓', top: seat !== loser, lose: seat === loser,
        score: seat === loser ? `持有${k.loserName}` : `配對 ${s.pairs[seat]} 組`, detail: `剩 ${s.hands[seat].length} 張手牌`,
      })),
    };
  }
  /* 重新排等待名單：抽牌者一個（限時）＋其他真人的「隨時配對」（不限時）；電腦直接配好 */
  function setWaits(s) {
    const t = nextSeat(s, s.turn, j => s.hands[j].length > 0);
    if (t < 0) { finish(s, ''); return; }
    s.target = t;
    s.wait = [{ seat: s.turn, kind: 'draw', from: t }];
    s.seats.forEach((st, i) => {
      if (i === s.turn || i === t || !s.hands[i].length) return;
      if (isBot(st)) autoAll(s, i);
      else s.wait.push({ seat: i, kind: 'free' });
    });
    const why = overReason(s);
    if (why) finish(s, why);
  }
  const AFTER_MS = 5000;
  /* 真人抽完牌：給 5 秒把對子出掉；這段時間沒有人被抽牌，其他真人也可以出 */
  function openAfter(s, seat) {
    s.wait = [{ seat, kind: 'afterdraw', optional: true }];
    s.seats.forEach((st, i) => {
      if (i === seat || !s.hands[i].length) return;
      if (isBot(st)) autoAll(s, i);
      else s.wait.push({ seat: i, kind: 'free' });
    });
    const why = overReason(s);
    if (why) finish(s, why);
  }
  function endTurn(s) {
    s.idle = s.total === s.lastTotal ? s.idle + 1 : 0;
    s.lastTotal = s.total;
    if (s.idle >= 3 * s.seats.length) s.stalled = true;
    const why = overReason(s);
    if (why) { finish(s, why); return; }
    s.turn = nextSeat(s, s.turn, j => s.hands[j].length > 0);
    setWaits(s);
  }

  return defineGame({
    id: k.id,
    thinkMs: (s, w) => (w.kind === 'draw' ? 900 : 250),
    /* 開局整理手牌給每手限時的 4 倍；隨時配對不限時；抽完出對子固定 5 秒 */
    limitMs: (s, w) => (w.kind === 'free' ? 0 : w.kind === 'prepair' ? s.limit * 4000 : w.kind === 'afterdraw' ? AFTER_MS : null),
    init(cfg) {
      const seats = makeSeats(cfg.seats);
      const n = seats.length;
      const deck = shuffle(k.deckIds());
      const aside = k.setAside ? deck.pop() : null;
      deck.push(k.loser);
      shuffle(deck);
      const hands = seats.map(() => []);
      deck.forEach((id, i) => hands[i % n].push(id));
      const s = { seats, opts: cfg.opts, hands, pairs: seats.map(() => 0), total: 0, lastPair: null, aside, phase: 'draw', turn: 0, target: 1, wait: [], show: { type: 'intro' }, idle: 0, lastTotal: 0, drawn: null };
      seats.forEach((st, i) => { if (st.ai) autoAll(s, i); });
      s.lastPair = null; s.lastTotal = s.total; s.show = { type: 'intro' };
      s.wait = seats.map((st, i) => i).filter(i => !seats[i].ai).map(seat => ({ seat, kind: 'prepair' }));
      if (s.wait.length) { s.phase = 'prepair'; sayS(s, '發牌完成，先整理手牌。', 'turn'); }
      else setWaits(s);
      return s;
    },
    act(s, seat, a, w, meta = {}) {
      if (w.kind === 'prepair') {
        if (a.type === 'pair') {
          if (!s.hands[seat].includes(a.a) || !s.hands[seat].includes(a.b) || a.a === a.b) return { err: '請選自己手上的兩張牌。' };
          if (!pairOK(a.a, a.b)) return { err: k.notWhy(C(a.a), C(a.b)) };
          pairUp(s, seat, a.a, a.b);
          sayS(s, `${L(s, seat)} 配對成功：${k.pairWhy(C(a.a), C(a.b))}`, 'ok');
          return;
        }
        if (a.type === 'autoall') autoAll(s, seat);
        else if (a.type !== 'done') return { err: '無法執行這個動作。' };
        if (meta.timeout) sayS(s, `⏰ ${L(s, seat)} 整理時間到。`, 'bad');
        s.wait = s.wait.filter(x => x !== w);
        if (!s.wait.length) {
          s.phase = 'draw'; s.lastTotal = s.total; s.show = { type: 'start' };
          sayS(s, '開始抽牌！輪到自己時可以先出對子再抽；正被別人抽牌時先暫停。', 'turn');
          setWaits(s);
        }
        return;
      }
      if (w.kind === 'free') {
        if (a.type === 'autoall') { autoAll(s, seat); s.wait = s.wait.filter(x => x !== w); }
        else if (a.type === 'pair') {
          if (!s.hands[seat].includes(a.a) || !s.hands[seat].includes(a.b) || a.a === a.b) return { err: '請選自己手上的兩張牌。' };
          if (!pairOK(a.a, a.b)) return { err: k.notWhy(C(a.a), C(a.b)) };
          pairUp(s, seat, a.a, a.b);
          sayS(s, `${L(s, seat)} 配對成功：${k.pairWhy(C(a.a), C(a.b))}`, 'ok');
          if (!s.hands[seat].length) s.wait = s.wait.filter(x => x !== w);
        } else return { err: '無法執行這個動作。' };
        const why = overReason(s);
        if (why) finish(s, why);
        return;
      }
      if (w.kind === 'draw' && a.type === 'pair') {
        /* 輪到自己抽牌：可以先把手上的對子出掉再抽 */
        if (!s.hands[seat].includes(a.a) || !s.hands[seat].includes(a.b) || a.a === a.b) return { err: '請選自己手上的兩張牌。' };
        if (!pairOK(a.a, a.b)) return { err: k.notWhy(C(a.a), C(a.b)) };
        pairUp(s, seat, a.a, a.b);
        sayS(s, `${L(s, seat)} 配對成功：${k.pairWhy(C(a.a), C(a.b))}`, 'ok');
        const why = overReason(s);
        if (why) { finish(s, why); return; }
        if (!s.hands[seat].length) { s.wait = []; s.hold = 800; endTurn(s); }   // 牌出完了就不用抽
        return;
      }
      if (w.kind === 'draw') {
        const from = w.from, hand = s.hands[from];
        const idx = a.type === 'draw' ? a.index : -1;
        if (!(idx >= 0 && idx < hand.length)) return { err: '請點選一張對方的牌。' };
        const card = hand.splice(idx, 1)[0];
        s.hands[seat].push(card);
        s.drawn = { seat, from, card };
        const mate = s.hands[seat].find(x => x !== card && pairOK(card, x));
        if (meta.bot) {
          if (mate) { pairUp(s, seat, card, mate); sayS(s, `${L(s, seat)} 從 ${L(s, from)} 抽牌，配對成功：${k.pairWhy(C(card), C(mate))}`, 'ok'); }
          else { s.show = { type: 'drew', seat, from }; sayS(s, `${L(s, seat)} 從 ${L(s, from)} 抽了一張牌，無法配對，收進手牌。`); }
          autoAll(s, seat);
        } else {
          s.show = { type: 'drawn', seat, from, card };
          sayS(s, meta.timeout ? `⏰ ${L(s, seat)} 超時，系統幫他從 ${L(s, from)} 隨機抽了一張。` : `${L(s, seat)} 從 ${L(s, from)} 抽了一張牌。`, meta.timeout ? 'bad' : '');
        }
        if (!meta.bot && !meta.timeout && s.hands[seat].length) { openAfter(s, seat); return; }
        s.hold = meta.bot ? 1100 : 500;
        endTurn(s);
        return;
      }
      if (w.kind === 'afterdraw') {
        if (a.type === 'pair') {
          if (!s.hands[seat].includes(a.a) || !s.hands[seat].includes(a.b) || a.a === a.b) return { err: '請選自己手上的兩張牌。' };
          if (!pairOK(a.a, a.b)) return { err: k.notWhy(C(a.a), C(a.b)) };
          pairUp(s, seat, a.a, a.b);
          sayS(s, `${L(s, seat)} 配對成功：${k.pairWhy(C(a.a), C(a.b))}`, 'ok');
          const why = overReason(s);
          if (why) { finish(s, why); return; }
          if (!s.hands[seat].length) { s.wait = []; s.hold = 800; endTurn(s); }
          return;
        }
        if (a.type === 'autoall') autoAll(s, seat);
        else if (a.type !== 'pass') return { err: '無法執行這個動作。' };
        s.wait = []; s.hold = 300;
        endTurn(s);
        return;
      }
      return { err: '無法執行這個動作。' };
    },
    ai(s, seat, w) {
      if (w.kind === 'draw') return { type: 'draw', index: rand(s.hands[w.from].length) };
      return { type: 'autoall' };
    },
    timeout(s, seat, w) {
      if (w.kind === 'draw') return { type: 'draw', index: rand(s.hands[w.from].length) };
      if (w.kind === 'afterdraw') return { type: 'pass' };
      if (w.kind === 'prepair') return { type: 'done' };
      return { type: 'autoall' };
    },
    step() {},
    finish,
    /* 示範對局的解說 */
    teach(s) {
      if (s.over) return '';
      const sh = s.show || {}, w = s.wait.find(x => x.kind === 'draw');
      const next = w ? ` 接下來輪到 ${L(s, w.seat)} 從 ${L(s, w.from)} 手上抽一張。` : '';
      if (sh.type === 'pair') return `為什麼是一對？${k.explain(C(sh.a), C(sh.b))}${next}`;
      if (sh.type === 'drew') return `抽到的牌和手上的牌都配不起來，只好收進手牌。${next}`;
      if (w) return `每個人先把手上能配對的牌打出來（${k.intro}）。接著輪流從下一位手上抽一張牌，抽到能配對的就打出來；${k.loserName}永遠配不起來，最後拿著它的人輸。${next}`;
      return `開局：每個人先把手上能配對的牌打出來（${k.intro}）。`;
    },
    render(s, v) {
      const me = v.seat, w = v.myWait(), ui = v.ui;
      ui.sel = ui.sel || [];
      let center;
      if (w && w.kind === 'draw') {
        if (!ui.order || ui.order.length !== s.hands[w.from].length) ui.order = shuffle(s.hands[w.from].map((_, i) => i));
        center = h('div', { class: 'drawpick' },
          h('p', { class: 'drawpick-t' }, `從 ${L(s, w.from)} 的手牌抽一張（手上有對子可以先出）`),
          h('div', { class: 'drawrow' }, ui.order.map(i => cardEl(null, { back: true, deck: k.deck, onClick: () => v.send({ type: 'draw', index: i }) }))));
      } else if (s.show.type === 'pair') {
        center = h('div', { class: 'showcase' }, h('div', { class: 'pairshow' }, cardEl(C(s.show.a)), h('span', { class: 'eq' }, '='), cardEl(C(s.show.b))),
          h('p', { class: 'why', html: `${L(s, s.show.seat)}：${k.pairWhy(C(s.show.a), C(s.show.b))}` }));
      } else if (s.show.type === 'drawn' && s.show.seat === me) {
        center = h('div', { class: 'showcase' }, cardEl(C(s.show.card), { size: 'lg' }), h('p', { class: 'why', html: `你抽到 ${cardInline(C(s.show.card))}` }),
          w && w.kind === 'afterdraw' ? h('p', { class: 'muted' }, '有對子就點兩張牌出掉；好了按「換下一位」，5 秒後也會自動換人。') : null);
      } else if (s.show.type === 'drawn' || s.show.type === 'drew') {
        center = h('div', { class: 'showcase' }, h('p', { class: 'why' }, `${L(s, s.show.seat)} 從 ${L(s, s.show.from)} 抽了一張牌`));
      } else if (s.phase === 'prepair') {
        center = h('div', { class: 'intro-card' }, h('b', {}, '開局：先把能配對的牌找出來'), h('p', {}, k.intro + '。點選兩張牌就會檢查。'),
          h('p', { class: 'muted' }, w ? '整理好按「整理好了」；時間到會自動開始。' : `等其他人整理手牌…（還有 ${s.wait.length} 人）`));
      } else {
        center = h('div', { class: 'intro-card' }, h('b', {}, '配對隨時可以出'), h('p', {}, k.intro + '。點選兩張牌就會檢查。'),
          h('p', { class: 'muted' }, '輪到自己時可以先出對子再抽；正被別人抽牌時先暫停。'));
      }
      const side = h('div', { class: 'center-side' },
        h('div', { class: 'pile-info' },
          h('div', { class: 'pile-pair' }, s.lastPair ? s.lastPair.map(id => cardEl(C(id), { size: 'sm' })) : h('span', { class: 'pile-empty' }, '配對成功的牌放這裡')),
          h('small', {}, `桌面上已配對 ${s.total} 組`)),
        s.aside ? h('div', { class: 'aside' }, cardEl(null, { back: true, deck: k.deck, size: 'sm' }), h('small', {}, '開局抽出、不使用的牌')) : null);
      const canPair = w && (w.kind === 'free' || w.kind === 'prepair' || w.kind === 'draw' || w.kind === 'afterdraw');
      const onCard = canPair ? id => {
        if (id === k.loser) { v.note(k.loserMsg, 'bad'); return; }
        ui.sel = ui.sel.includes(id) ? ui.sel.filter(x => x !== id) : [...ui.sel, id];
        if (ui.sel.length === 2) {
          const [a, b] = ui.sel; ui.sel = [];
          if (pairOK(a, b)) { v.note(''); v.send({ type: 'pair', a, b }); return; }
          v.note('✗ ' + k.notWhy(C(a), C(b)), 'bad');
        }
        v.render();
      } : null;
      let meLine = '';
      if (me != null) {
        meLine = `${s.hands[me].length} 張 · 配對 ${s.pairs[me]} 組`;
        if (!s.over && s.phase === 'prepair') meLine += w ? ' · <b>整理手牌中</b>' : ' · 整理好了，等其他人';
        else if (!s.over) {
          if (w && w.kind === 'afterdraw') meLine += ' · <b>抽完了：有對子就出</b>';
          else if (s.turn === me) meLine += ' · <b>輪到你抽牌</b>（可以先出對子）';
          else if (s.target === me) meLine += ` · <b>${L(s, s.turn)} 正在從你手上抽牌</b>`;
          else if (canPair) meLine += ' · 可以配對';
        }
      }
      const hand = me != null ? cardsEls(s.hands[me], { sel: ui.sel, onClick: onCard, newId: s.drawn && s.drawn.seat === me ? s.drawn.card : null }) : null;
      cardFrame(v, s, {
        seatLine: i => `${s.hands[i].length} 張 · 配對 ${s.pairs[i]} 組${!s.over && s.turn === i ? ' · 抽牌中' : ''}`,
        meLine, center: [center, side], hand,
        actions: w && w.kind === 'prepair' ? [{ label: '整理好了，開始抽牌', primary: true, onClick: () => v.send({ type: 'done' }) }]
          : w && w.kind === 'afterdraw' ? [{ label: '好了，換下一位', primary: true, onClick: () => v.send({ type: 'pass' }) }] : [],
      });
    },
  });
}

'use strict';
/* ============================================================
   撿紅點類：配對PK賽（畫地取寶）、綠色能源（抓鬼特工）
   ============================================================ */
const greenPts = id => { const c = C(id); return c.color === 'green' ? Math.min(c.base, 10) : 0; };

function fishingDef(k) {
  const pairOK = (a, b) => k.canPair(C(a), C(b));
  const L = (s, i) => seatLabel(s.seats[i]);
  const best = ms => (k.mode === 'green' ? ms.slice().sort((a, b) => greenPts(b) - greenPts(a))[0] : ms[0]);
  const score = (s, seat) => (k.mode === 'green' ? s.caps[seat].flat().reduce((t, id) => t + greenPts(id), 0) : s.caps[seat].length);

  function finish(s, reason) {
    s.over = true; s.phase = 'over'; s.wait = []; s.auto = null;
    const ranked = rankSeats(s.seats.length, seat => score(s, seat));
    s.result = {
      title: winnerTitle(s, ranked),
      note: (reason || '') + (k.mode === 'green' ? '計分：收回的綠色指數牌以「底數」為分數，底數超過 10 的以 10 分計。' : '配對成功組數多者獲勝。'),
      rows: ranked.map(r => ({
        seat: r.seat, rank: String(r.rank), top: r.top,
        score: k.mode === 'green' ? `${score(s, r.seat)} 分` : `${score(s, r.seat)} 組`,
        detail: k.mode === 'green' ? (s.caps[r.seat].flat().filter(id => C(id).color === 'green').map(id => powHTML(C(id))).join('、') || '沒有收回綠牌') : `收回 ${s.caps[r.seat].length * 2} 張牌`,
      })),
    };
  }
  function nextTurn(s) {
    s.flip = null;
    s.phase = 'play';
    const t = nextSeat(s, s.turn, j => s.hands[j].length > 0);
    if (t < 0) { finish(s, '所有人的手牌都出完了。'); return; }
    s.turn = t;
    s.wait = [{ seat: t, kind: 'play' }];
  }
  function capture(s, seat, a, b) {
    s.ev = { type: 'cap', seat, a, b };
    s.table = s.table.filter(x => x !== b);
    s.caps[seat].push([a, b]);
    s.lastCap = [a, b];
  }

  return defineGame({
    id: k.id,
    thinkMs: () => 800,
    init(cfg) {
      const seats = makeSeats(cfg.seats);
      const deck = shuffle(k.deckIds());
      const per = Math.floor(24 / seats.length);
      const hands = seats.map(() => deck.splice(0, per));
      const table = deck.splice(0, 4);
      const s = { seats, opts: cfg.opts, hands, table, deck, caps: seats.map(() => []), turn: 0, phase: 'play', flip: null, lastCap: null, wait: [{ seat: 0, kind: 'play' }] };
      sayS(s, `每人 ${per} 張手牌，${k.tableShort}翻開 4 張。`, 'turn');
      return s;
    },
    act(s, seat, a, w, meta = {}) {
      if (w.kind === 'play') {
        const hand = s.hands[seat];
        if (a.type !== 'play' || !hand.includes(a.card)) return { err: '請先從手牌選一張牌。' };
        /* 能不能配對由玩家自己判斷：能配對也可以直接丟到桌面 */
        /* 配對點錯不能重選：當作沒配對，出的牌直接留在桌面 */
        let wrong = null;
        if (a.match != null) {
          if (!s.table.includes(a.match)) return { err: `那張牌已經不在${k.tableShort}上了。` };
          if (!pairOK(a.card, a.match)) { wrong = a.match; a = { ...a, match: null }; }
        }
        s.hands[seat] = hand.filter(x => x !== a.card);
        s.wait = [];
        s.lastPlaced = null;
        if (a.match != null) { capture(s, seat, a.card, a.match); sayS(s, `${L(s, seat)} 配對成功：${k.pairWhy(C(a.card), C(a.match))}`, 'ok'); }
        else if (wrong != null) { s.ev = { type: 'wrong' }; s.table.push(a.card); s.lastPlaced = a.card; sayS(s, `✗ ${L(s, seat)} 配對錯誤：${k.notWhy(C(a.card), C(wrong))}這張牌留在${k.tableShort}。`, 'bad'); }
        else { s.ev = { type: 'place', seat, card: a.card }; s.table.push(a.card); s.lastPlaced = a.card; sayS(s, `${meta.timeout ? `⏰ ${L(s, seat)} 超時，隨機` : `${L(s, seat)} `}把 ${cardInline(C(a.card))} ${k.placeLabel}。`, meta.timeout ? 'bad' : ''); }
        s.turn = seat;
        const flipNow = k.mode === 'pk' || a.match != null;
        if (flipNow && s.deck.length) s.auto = { kind: 'flip', seat, delay: 1000 };
        else if (k.mode === 'green' && a.match == null && s.deck.length) s.auto = { kind: 'draw', seat, delay: 900 };
        else { s.hold = 1000; nextTurn(s); }
        return;
      }
      if (w.kind === 'flipmatch') {
        if (a.type === 'skip' || a.type === 'place') {
          s.ev = { type: 'flipstay', card: s.flip };
          s.table.push(s.flip); s.lastPlaced = s.flip;
          sayS(s, a.type === 'skip' ? `⏰ ${L(s, seat)} 超時，翻出的牌留在${k.tableShort}。` : `${L(s, seat)} 把翻出的 ${cardInline(C(s.flip))} 留在${k.tableShort}。`, a.type === 'skip' ? 'bad' : '');
          s.wait = []; s.hold = 900; nextTurn(s);
          return;
        }
        if (a.type !== 'match' || !s.table.includes(a.target)) return { err: `請點選${k.tableShort}上的一張牌。` };
        if (!pairOK(s.flip, a.target)) {
          s.ev = { type: 'wrong' };
          sayS(s, `✗ ${L(s, seat)} 配對錯誤：${k.notWhy(C(s.flip), C(a.target))}翻出的牌留在${k.tableShort}。`, 'bad');
          s.table.push(s.flip); s.lastPlaced = s.flip;
          s.wait = []; s.hold = 1600; nextTurn(s);
          return;
        }
        capture(s, seat, s.flip, a.target); s.ev.flip = true;
        sayS(s, `${L(s, seat)} 又配對成功：${k.pairWhy(C(s.flip), C(a.target))}`, 'ok');
        s.wait = []; s.hold = 1100; nextTurn(s);
        return;
      }
      return { err: '無法執行這個動作。' };
    },
    step(s, a) {
      if (a.kind === 'flip') {
        s.flip = s.deck.pop();
        s.ev = { type: 'flip', card: s.flip };
        sayS(s, `${L(s, a.seat)} 翻開牌堆：${cardInline(C(s.flip))}`);
        s.auto = { kind: 'flipres', seat: a.seat, delay: 900 };
        return;
      }
      if (a.kind === 'flipres') {
        const ms = s.table.filter(t => pairOK(s.flip, t));
        if (!isBot(s.seats[a.seat])) {
          s.phase = 'flipmatch';
          sayS(s, `翻出 ${cardInline(C(s.flip))}！${L(s, a.seat)} 判斷能不能和${k.tableShort}的牌配對：能就點那張牌，不能就點「留在${k.tableShort}」。`, 'turn');
          s.wait = [{ seat: a.seat, kind: 'flipmatch' }];
          return;
        }
        if (!ms.length) {
          s.ev = { type: 'flipstay', card: s.flip };
          s.table.push(s.flip); s.lastPlaced = s.flip;
          sayS(s, `翻出的 ${cardInline(C(s.flip))} 沒有可配對的牌，留在${k.tableShort}。`);
          s.hold = 1000; nextTurn(s);
          return;
        }
        const m = best(ms);
        capture(s, a.seat, s.flip, m); s.ev.flip = true;
        sayS(s, `${L(s, a.seat)} 又配對成功：${k.pairWhy(C(s.flip), C(m))}`, 'ok');
        s.hold = 1100; nextTurn(s);
        return;
      }
      if (a.kind === 'draw') {
        const c = s.deck.pop();
        s.hands[a.seat].push(c);
        s.drawnNew = { seat: a.seat, card: c };
        s.ev = { type: 'draw', seat: a.seat };
        sayS(s, `${L(s, a.seat)} 從牌堆摸了一張牌。`);
        s.hold = 700; nextTurn(s);
      }
    },
    ai(s, seat, w) {
      if (w.kind === 'flipmatch') { const ms = s.table.filter(t => pairOK(s.flip, t)); return ms.length ? { type: 'match', target: best(ms) } : { type: 'place' }; }
      let pickB = null;
      for (const c of shuffle(s.hands[seat].slice())) {
        const ms = s.table.filter(t => pairOK(c, t));
        if (!ms.length) continue;
        const m = best(ms), val = greenPts(c) + greenPts(m) + 1;
        if (!pickB || val > pickB.val) pickB = { card: c, match: m, val };
      }
      if (pickB) return { type: 'play', card: pickB.card, match: pickB.match };
      const sorted = s.hands[seat].slice().sort((a, b) => greenPts(a) - greenPts(b));
      return { type: 'play', card: k.mode === 'green' ? sorted[0] : pick(s.hands[seat]), match: null };
    },
    /* 超時：出牌是一定要做的動作 → 隨機丟一張到桌面；翻牌配對 → 翻出的牌留在桌面 */
    timeout: (s, seat, w) => (w.kind === 'play' ? { type: 'play', card: pick(s.hands[seat]), match: null } : { type: 'skip' }),
    finish,
    /* 示範對局的解說 */
    teach(s) {
      if (s.over) return '';
      const e = s.ev || {}, T = k.tableShort;
      if (e.type === 'cap') {
        let t = `為什麼能配對？${k.explain(C(e.a), C(e.b))}`;
        const g = k.mode === 'green' && [e.a, e.b].map(C).find(c => c.color === 'green');
        if (g) t += `收回的綠色指數牌 ${powHTML(g)} 底數是 ${g.base}，可以得 ${Math.min(g.base, 10)} 分。`;
        return t + (!e.flip && s.deck.length ? '配對成功後，翻開牌堆一張。' : '');
      }
      if (e.type === 'place') return `${L(s, e.seat)} 手上沒有和${T}數值相同的牌，只好丟一張到${T}${k.mode === 'green' ? '，再從牌堆摸一張' : '，接著翻開牌堆一張'}。`;
      if (e.type === 'flip') return `翻出 ${cardInline(C(e.card))}：${k.cardWhy(C(e.card))}。看看${T}有沒有數值相同的牌。`;
      if (e.type === 'flipstay') return `${k.cardWhy(C(e.card))}。${T}上沒有數值相同的牌，所以只好留在${T}。`;
      if (e.type === 'draw') return '這一手沒有配對成功，所以從牌堆摸一張牌進手牌。';
      if (e.type === 'wrong') return `配對點錯了，那張牌直接留在${T}。`;
      return `每人先拿手牌，${T}翻開 4 張。輪到你時，找一張和${T}數值相同的手牌配對收回；沒有就丟一張到${T}。`;
    },
    render(s, v) {
      const me = v.seat, w = v.myWait(), ui = v.ui;
      const playing = w && w.kind === 'play', matching = w && w.kind === 'flipmatch';
      const onTable = (playing || matching) ? id => {
        if (matching) { v.send({ type: 'match', target: id }); return; }
        if (!ui.sel) { v.note('先從手牌選一張要出的牌。', 'bad'); return; }
        v.send({ type: 'play', card: ui.sel, match: id });
      } : null;
      const slot = playing || matching ? h('button', {
        type: 'button', class: 'dropslot' + (playing && !ui.sel ? ' idle' : ''),
        onclick: () => {
          if (matching) { v.send({ type: 'place' }); return; }
          if (!ui.sel) { v.note(`先從手牌選一張要${k.placeLabel}的牌。`, 'bad'); return; }
          v.send({ type: 'play', card: ui.sel, match: null });
        },
      }, h('b', {}, matching ? `留在${k.tableShort}` : k.placeLabel), h('small', {}, matching ? '不配對' : ui.sel ? '丟這張' : '先選手牌')) : null;
      const tableEls = [slot, ...(s.table.length ? cardsEls(s.table, { onClick: onTable, newId: s.lastPlaced }) : [h('span', { class: 'pile-empty' }, '目前沒有牌')])];
      const capsMine = me != null ? s.caps[me].flat() : [];
      const center = [
        h('div', { class: 'pilecol' },
          h('div', { class: 'pile' }, s.deck.length ? cardEl(null, { back: true, deck: k.deck }) : h('span', { class: 'pile-empty' }, '牌堆空了'), h('small', {}, `牌堆 ${s.deck.length} 張`)),
          h('div', { class: 'flipslot' }, s.flip ? cardEl(C(s.flip), { isNew: true }) : h('span', { class: 'flip-ph' }, '翻開的牌'))),
        h('div', { class: 'tablewrap' }, h('div', { class: 'zone-label' }, k.tableName), h('div', { class: 'tablecards' }, tableEls)),
        me != null ? h('div', { class: 'capwrap' }, h('div', { class: 'zone-label' }, '我收回的牌'),
          h('div', { class: 'caps' }, capsMine.length ? cardsEls(capsMine, { size: 'xs' }) : h('span', { class: 'pile-empty' }, '還沒有'))) : null,
      ];
      const hand = me != null ? cardsEls(s.hands[me], {
        sel: ui.sel ? [ui.sel] : [], newId: s.drawnNew && s.drawnNew.seat === me ? s.drawnNew.card : null,
        onClick: playing ? id => { ui.sel = ui.sel === id ? null : id; v.note(''); v.render(); } : null,
      }) : null;
      const actions = [];
      const line = i => `${s.hands[i].length} 張 · ${k.mode === 'green' ? `能源 ${score(s, i)} 分` : `配對 ${score(s, i)} 組`}`;
      const status = playing ? ' · <b>輪到你出牌</b>' : matching ? ' · <b>翻出的牌要配對嗎？</b>' : '';
      cardFrame(v, s, { seatLine: line, meLine: me != null ? line(me) + status : '', center, centerClass: 'fish', hand, actions });
    },
  });
}

        sayS(s, `${T} 加連 ${m.pts[qi].label}–${m.pts[R].label}，圍成封閉區域${gain ? `，圈住 ${gain} 個寶物！` : '。'}`, 'ok');
      } else if (meta.timeout) sayS(s, `⏰ ${T} 超時，不加連線段。`, 'bad');
      s.wait = []; s.hold = 1000; this.nextTurn(s);
      return;
    }
    return { err: '無法執行這個動作。' };
  },
  step(s, a) {
    if (a.kind !== 'roll') return;
    const seat = s.turn, t = s.teams[seat], T = this.team(s, seat);
    const n = 1 + rand(6), card = C(s.move.card), start = s.move.start;
    s.die = n; s.rolling = false;
    s.move.n = n;
    s.move.explain = kingExplain(t.flip, card, n);
    const A = s.map.pts[start];
    const opts = kingMoves(t.flip, card, n).map(o => { const Q = { x: A.x + o.dx, y: A.y + o.dy }; return { dx: o.dx, dy: o.dy, Q, label: dirName(o), ...this.check(s, start, Q) }; });
    s.move.opts = opts;
    if (!opts.length) { sayS(s, `${T} 擲出 ${n}：位移為 0，原地不動，這張牌作廢。`, 'bad'); s.hold = 2000; this.nextTurn(s); return; }
    if (!opts.some(o => o.ok)) {
      t.free = true;  // 補救規則：無處可走，下一手可任選己方的點重新出發
      sayS(s, `${T} 擲出 ${n}：無法移動（${[...new Set(opts.map(o => o.reason))].join('；')}），這張牌作廢、留在原地。下一手可以改從任一個己方的點出發。`, 'bad');
      s.hold = 2200; this.nextTurn(s); return;
    }
    s.phase = 'dir';
    const okOpts = opts.filter(o => o.ok);
    sayS(s, `${T} 擲出 ${n}。${okOpts.length > 1 ? '兩個方向任選一個。' : opts.length > 1 ? `另一個方向走不了，只能${okOpts[0].label}。` : '確認落點。'}`, 'turn');
    s.wait = [{ seat, kind: 'dir' }];
  },
  potential(s, seat, Q) {
    let v = 0;
    for (const tr of s.treasures) if (!mapEncloses(s.map, seat, tr)) v += Math.exp(-((tr.x - Q.x) ** 2 + (tr.y - Q.y) ** 2) / 5);
    return v;
  },
  bestPlace(s, seat, card, n, starts) {
    const t = s.teams[seat];
    let best = null;
    for (const s0 of starts) {
      const A = s.map.pts[s0];
      kingMoves(t.flip, card, n).forEach((o, i) => {
        const Q = { x: A.x + o.dx, y: A.y + o.dy };
        if (!this.check(s, s0, Q).ok) return;
        const close = t.pts.length >= 2 ? mapBestClose(s.map, seat, t.pts, s0, Q, poly => this.newIn(s, seat, poly)) : { gain: 0 };
        const score = close.gain * 10 + this.potential(s, seat, Q) + Math.random() * 0.05;
        if (!best || score > best.score) best = { start: s0, i, score };
      });
    }
    return best;
  },
  ai(s, seat, w) {
    const t = s.teams[seat], lv = s.seats[seat].level;
    if (w.kind === 'choose') {
      let starts = t.free ? t.pts.slice() : [t.cur];
      if (starts.length > 6) starts = starts.sort((a, b) => this.potential(s, seat, s.map.pts[b]) - this.potential(s, seat, s.map.pts[a])).slice(0, 6);
      const noise = { easy: 2.5, normal: 0.7, hard: 0.05 }[lv] || 0.7;
      let best = null;
      for (const id of t.hand) {
        const card = C(id);
        const byStart = new Map();
        for (let n = 1; n <= 6; n++) {
          for (const s0 of starts) {
            const b = this.bestPlace(s, seat, card, n, [s0]);
            byStart.set(s0, (byStart.get(s0) || 0) + (b ? b.score : (kingMoves(t.flip, card, n).length ? -3 : -1.5)));
          }
        }
        for (const [s0, tot] of byStart) { const ev = tot / 6 + Math.random() * noise; if (!best || ev > best.ev) best = { card: id, start: s0, ev }; }
      }
      return { type: 'choose', card: best.card, start: best.start };
    }
    if (w.kind === 'dir') {
      const valid = s.move.opts.map((o, i) => ({ o, i })).filter(x => x.o.ok);
      if (lv === 'easy' && Math.random() < 0.4) return { type: 'dir', i: pick(valid).i };
      const b = this.bestPlace(s, seat, C(s.move.card), s.move.n, [s.move.start]);
      return { type: 'dir', i: b ? b.i : valid[0].i };
    }
    let R = null, bg = 0;
    for (const c of s.move.cands) { const g = this.newIn(s, seat, mapPoly(s.map, mapCycle(s.map, seat, s.move.start, c, s.move.qi))); if (g > bg) { bg = g; R = c; } }
    return { type: 'close', R };
  },
  /* 示範對局的解說 */
  teach(s) {
    if (s.over) return '';
    const T = this.team(s, s.turn);
    if (s.move && s.move.card) {
      const c = C(s.move.card);
      const base = c.kind === 'trig' ? trigReason(c.fn, c.angle) : `數值卡 ${exHTML(c.value)} 代表斜率 ${exHTML(c.value)}`;
      if (s.phase === 'roll') return `${T}出了 ${cardInline(c)}：${base}。擲骰子決定要走幾單位（n）。`;
      const ex = s.move.explain && s.move.explain.replace(/<small>(.*?)。?<\/small>/, '（$1）');
      if (ex) return `${base}。擲出 ${s.move.n}：${ex}${s.phase === 'close' ? '。新的點可以和自己的舊點連成封閉區域，圈住寶物就得分。' : ''}`;
    }
    return `${T}選一張牌、擲骰子得到 n。sin θ 卡上下移動 n × sin θ；cos θ 卡左右移動 n × cos θ；tan θ 和數值卡沿那個斜率的直線走 n 單位。新的點要和前一點連線，線段不能交叉。`;
  },
  /* 超時：出牌、選方向是一定要做的 → 隨機代為出手；要不要加連線段可做可不做 → 不連 */
  timeout(s, seat, w) {
    if (w.kind === 'close') return { type: 'close', R: null };
    if (w.kind === 'dir') return { type: 'dir', i: pick(s.move.opts.map((o, i) => ({ o, i })).filter(x => x.o.ok)).i };
    return { type: 'choose', card: pick(s.teams[seat].hand), start: s.teams[seat].cur };
  },
  render(s, v) {
    const me = v.seat, w = v.myWait(), ui = v.ui;
    const W = KING_W, H = KING_H, m = s.map;
    const colors = s.seats.map(st => st.color);
    const myTeam = me != null ? s.teams[me] : null;
    /* 我這一手的本機選擇 */
    if (w && w.kind === 'choose' && ui.start == null) ui.start = myTeam.cur;
    let ghosts = [], from = null, click = null, onPoint = null, mark = null, preview = null, previewLine = null;
    if (s.move && s.move.opts && (s.phase === 'dir')) { from = s.move.start; ghosts = s.move.opts.map((o, i) => ({ ...o, i })); }
    if (w && w.kind === 'choose' && myTeam.free) { click = new Set(myTeam.pts); onPoint = i => { ui.start = i; v.render(); }; }
    if (w && w.kind === 'close') {
      click = new Set(s.move.cands); mark = click; onPoint = i => { ui.R = i; v.render(); };
      if (ui.R != null) { preview = mapPoly(m, mapCycle(m, me, s.move.start, ui.R, s.move.qi)); previewLine = [s.move.qi, ui.R]; }
    }
    const cur = w && w.kind === 'choose' ? ui.start : (s.move ? (s.move.qi != null ? s.move.qi : s.move.start) : s.teams[s.turn].cur);
    const g = [sv('rect', { x: -W, y: -H, width: 2 * W, height: 2 * H, class: 'paper-bg' })];
    const grid = sv('g', { class: 'grid' });
    for (let x = -W; x <= W; x++) grid.append(sv('line', { x1: x, y1: -H, x2: x, y2: H }));
    for (let y = -H; y <= H; y++) grid.append(sv('line', { x1: -W, y1: y, x2: W, y2: y }));
    g.push(grid);
    const polyPts = poly => poly.map(P => `${P.x},${-P.y}`).join(' ');
    [0, 1].forEach(i => (m.cycles[i] || []).forEach(c => g.push(sv('polygon', { points: polyPts(mapPoly(m, c)), class: 'region', style: `--pc:${colors[i]}` }))));
    if (preview) g.push(sv('polygon', { points: polyPts(preview), class: 'region preview', style: `--pc:${colors[me]}` }));
    s.treasures.forEach(tr => g.push(chestIcon(tr.x, tr.y, [0, 1].filter(i => mapEncloses(m, i, tr)), colors)));
    m.edges.forEach(e => g.push(sv('line', { x1: m.pts[e.a].x, y1: -m.pts[e.a].y, x2: m.pts[e.b].x, y2: -m.pts[e.b].y, class: 'edge' + (e.closing ? ' closing' : ''), style: `--pc:${colors[e.owner]}` })));
    if (previewLine) { const [a, b] = previewLine.map(i => m.pts[i]); g.push(sv('line', { x1: a.x, y1: -a.y, x2: b.x, y2: -b.y, class: 'edge closing pending', style: `--pc:${colors[me]}` })); }
    if (from != null) ghosts.forEach(gh => g.push(sv('line', { x1: m.pts[from].x, y1: -m.pts[from].y, x2: gh.Q.x, y2: -gh.Q.y, class: 'ghost-seg' + (gh.ok ? '' : ' bad'), style: `--pc:${colors[s.turn]}` })));
    m.pts.forEach((P, i) => {

      if (click && click.has(i)) { grp.append(sv('circle', { cx: P.x, cy: -P.y, r: 0.6, class: 'hit' })); svgClickable(grp, () => onPoint(i), `點 ${P.label}`); }
      g.push(grp);
    });
    ghosts.forEach(gh => {
      const grp = sv('g', { class: 'ghost-pt' + (gh.ok ? ' ok' : ' bad'), style: `--pc:${colors[s.turn]}` });
      const cx = clamp(gh.Q.x, -W - 0.6, W + 0.6), cy = -clamp(gh.Q.y, -H - 0.7, H + 0.7);
      grp.append(sv('circle', { cx, cy, r: 0.24, class: 'gp' }));
      if (!gh.ok) grp.append(sv('path', { d: `M${cx - 0.14} ${cy - 0.14} l0.28 0.28 m0 -0.28 l-0.28 0.28`, class: 'gx' }));
      if (gh.ok && w && w.kind === 'dir') { grp.append(sv('circle', { cx, cy, r: 0.65, class: 'hit' })); svgClickable(grp, () => v.send({ type: 'dir', i: gh.i }), gh.label); }
      g.push(grp);
    });
    const svgEl = sv('svg', { class: 'board king' + (w && (w.kind === 'dir' || w.kind === 'close') ? ' autofocus' : ''), viewBox: `${-W - 0.8} ${-H - 0.9} ${2 * W + 1.6} ${2 * H + 1.8}`, role: 'img', 'aria-label': '勝者為王圖紙' }, g);

    /* 右側面板 */
    const sc = this.scores(s);
    const teamsEl = h('div', { class: 'bteams' }, [0, 1].map(i => {
      const tw = waitOf(s, i), st = s.seats[i];
      const el = h('div', { class: 'bteam' + (tw ? ' active' : '') + (st.away ? ' away' : ''), style: `--pc:${st.color}` },
        h('span', { class: 'avatar' }, st.initial),
        h('b', {}, TEAM_NAMES[i], h('small', {}, ` ${seatLabel(st)}${st.ai ? `（電腦·${LEVELS[st.level]}）` : st.away ? (st.idle ? '（閒置·代打）' : '（離線·代打）') : ''}${me === i ? '（你）' : ''}`)),
        h('span', {}, `位置 ${m.pts[s.teams[i].cur].label}`), h('span', {}, `手牌 ${s.teams[i].hand.length}`), h('span', { class: 'gold' }, `寶物 ${sc[i]}`),
        s.thinking === i ? h('i', { class: 'dots' }) : null);
      if (tw && tw.remain != null) el.append(v.timerBar(tw));
      return el;
    }));
    const die = h('div', { class: 'die' + (s.rolling ? ' rolling' : s.die && s.phase === 'dir' ? ' landed' : ''), role: 'img' });
    setDie(die, s.rolling ? 1 + rand(6) : s.die);
    /* 擲骰中：本機持續換點數，做出滾動感 */
    if (v.rollTimer) { clearInterval(v.rollTimer); v.rollTimer = null; }
    if (s.rolling) v.rollTimer = setInterval(() => setDie(die, 1 + rand(6)), 90);
    const dieBox = h('div', { class: 'diebox' }, die, s.rolling ? h('small', {}, '擲骰中…') : s.die ? h('small', {}, `擲出 ${s.die}`) : null);
    let step = KING_MOVE_TABLE;
    if (w && w.kind === 'choose') step = ui.card ? kingRule(C(ui.card)) : `選一張牌${myTeam.free ? '，也可以點選任一個己方的點當新的出發點' : ''}，再按「擲骰子」。`;
    else if (s.move && s.move.explain) step = s.move.explain;
    else if (s.move && s.move.card) step = `出牌：${cardInline(C(s.move.card))}`;
    const actions = [];
    if (w && w.kind === 'choose') actions.push({ label: '擲骰子', primary: true, disabled: !ui.card, onClick: () => v.send({ type: 'choose', card: ui.card, start: ui.start }) });
    if (w && w.kind === 'dir') s.move.opts.forEach((o, i) => { if (o.ok) actions.push({ label: o.label, primary: true, onClick: () => v.send({ type: 'dir', i }) }); });
    if (w && w.kind === 'close') {
      if (ui.R != null) v.noteHTML = `<span>連到 ${m.pts[ui.R].label} 會圍出區域，新圈住 ${this.newIn(s, me, preview)} 個寶物。</span>`;
      actions.push({ label: '確認連線', primary: true, disabled: ui.R == null, onClick: () => v.send({ type: 'close', R: ui.R }) }, { label: '不連線', onClick: () => v.send({ type: 'close', R: null }) });
    }
    const hand = myTeam ? cardsEls(myTeam.hand, { size: 'sm', sel: ui.card ? [ui.card] : [], onClick: w && w.kind === 'choose' ? id => { ui.card = ui.card === id ? null : id; v.render(); } : null }) : null;
    const panel = h('aside', { class: 'bpanel' }, teamsEl,
      h('div', { class: 'msg ' + (s.msg ? s.msg.kind : ''), role: 'status', 'aria-live': 'polite', html: s.msg ? s.msg.html : '' }),
      h('div', { class: 'note', html: v.noteHTML }),
      h('div', { class: 'brow' + (w && w.kind === 'choose' ? ' autofocus' : '') }, dieBox, h('div', { class: 'bstep', html: step })),
      actions.length ? h('div', { class: 'actions bact' }, actions.map(btnEl)) : null,
      h('div', { class: 'bhand-head' },
        myTeam ? h('b', {}, `${TEAM_NAMES[me]}的手牌${v.o.spectate ? `（${v.o.specTag || '主持人觀看中'}）` : ''}`) : h('b', {}, '你正在觀戰'),
        myTeam ? h('span', {}, `${myTeam.hand.length} 張`) : null,
        w && w.remain != null ? v.timerBar(w, true) : null),
      myTeam ? h('div', { class: 'hand bhand' }, hand) : null);
    v.root.className = 'gmain boardgame';
    v.root.replaceChildren(h('div', { class: 'board-wrap' }, svgEl), panel);
    v.updateTimers();
    if (s.over && !v.o.noOverModal) showOver(v, s);
  },
});

'use strict';
/* ============================================================
   極速大挑戰（類似心臟病）：輪到的人翻開自己最上面的牌並喊一個數字，
   喊的數字和翻開的牌相符 → 所有人搶著拍，拍最慢的人收回中央的牌。
   最先把手上的牌出完的人優勝
   ============================================================ */
const SPEED_BOT = {                       // 電腦：拍中機率、反應時間（毫秒）、拍錯機率
  easy: { hit: 0.8, rt: [1200, 2200], wrong: 0.1 },
  normal: { hit: 0.92, rt: [850, 1600], wrong: 0.05 },
  hard: { hit: 0.98, rt: [550, 1100], wrong: 0.02 },
};
const speedCallHTML = v => exHTML(ALL_VALUES[v]);
const slapMs = s => (+s.opts.slap || 3) * 1000;

defineGame({
  id: 'speed',
  thinkMs(s, w) {
    if (w.kind !== 'slap') return 700 + rand(900);
    const p = s.plan[w.seat];
    return p && p.slap ? p.rt : slapMs(s);
  },
  limitMs: (s, w) => (w.kind === 'slap' ? Math.max(300, s.slapEnd - Date.now()) : null),
  init(cfg) {
    const seats = makeSeats(cfg.seats);
    const deck = shuffle(makeTreasureDeck().filter(c => c.kind === 'trig').map(c => c.id));   // 只用三角函數卡：翻開的是函數、喊的是值
    const hands = seats.map(() => []);
    deck.slice(0, deck.length - deck.length % seats.length).forEach((id, i) => hands[i % seats.length].push(id));
    const s = {
      seats, opts: cfg.opts, hands, pile: [], turn: 0, phase: 'call', call: null, lastCall: null, match: false,
      slaps: [], wrong: null, plan: {}, round: null, stats: seats.map(() => ({ slow: 0, wrong: 0 })), wait: [],
    };
    sayS(s, `每人 ${hands[0].length} 張牌，牌背朝上，不能看自己的牌。`, 'turn');
    this.setCall(s);
    return s;
  },
  setCall(s) {
    s.phase = 'call'; s.match = false; s.slaps = []; s.wrong = null; s.plan = {};
    s.wait = [{ seat: s.turn, kind: 'call' }];
  },
  /* 開始搶拍：每個人同時等待；電腦先決定要不要拍、多快拍 */
  openSlap(s) {
    s.phase = 'slap';
    s.slapOpen = Date.now(); s.slapEnd = s.slapOpen + slapMs(s);
    s.seats.forEach((st, i) => {
      if (!isBot(st)) return;
      const b = SPEED_BOT[st.ai ? st.level : 'normal'] || SPEED_BOT.normal;
      const slap = s.match ? Math.random() < b.hit : Math.random() < b.wrong;
      s.plan[i] = { slap, rt: s.match ? b.rt[0] + rand(b.rt[1] - b.rt[0]) : 700 + rand(800) };
    });
    s.wait = s.seats.map((_, i) => ({ seat: i, kind: 'slap', live: true, optional: true }));
  },
  finish(s, reason) {
    s.over = true; s.phase = 'over'; s.wait = []; s.auto = null;
    const ranked = rankSeats(s.seats.length, seat => s.hands[seat].length, false);
    s.result = {
      title: winnerTitle(s, ranked),
      note: `${reason || ''}最先把手上的牌出完者優勝；時間到則手上牌數少者獲勝。`,
      rows: ranked.map(r => ({ seat: r.seat, rank: String(r.rank), top: r.top, score: `${s.hands[r.seat].length} 張`, detail: `拍最慢 ${s.stats[r.seat].slow} 次、拍錯 ${s.stats[r.seat].wrong} 次` })),
    };
  },
  act(s, seat, a, w, meta = {}) {
    const L = i => seatLabel(s.seats[i]);
    if (w.kind === 'call') {
      if (a.type !== 'call' || !(a.v >= 0 && a.v < ALL_VALUES.length)) return { err: '請選一個要喊的數字。' };
      if (a.v === s.lastCall) return { err: '不能和前一位喊的數字相同。' };
      const card = s.hands[seat].shift();
      s.pile.push(card);
      s.call = { seat, v: a.v };
      s.lastCall = a.v;
      s.match = C(card).key === exKey(ALL_VALUES[a.v]);
      sayS(s, `${meta.timeout ? `⏰ ${L(seat)} 超時，系統代喊。` : ''}${L(seat)} 翻牌並喊「${speedCallHTML(a.v)}」！相符就快拍！`, 'turn');
      this.openSlap(s);
      return;
    }
    if (w.kind === 'slap') {
      if (a.type !== 'slap' && a.type !== 'pass') return { err: '無法執行這個動作。' };
      s.wait = s.wait.filter(x => x !== w);
      if (a.type === 'slap') {
        /* 反應時間以各自畫面從看到翻牌到按下的時間計，不受網路延遲影響 */
        const hostMs = Date.now() - s.slapOpen;
        const rt = meta.bot ? s.plan[seat].rt : clamp(Math.round(+a.rt || hostMs), 150, Math.max(150, hostMs));
        s.slaps.push({ seat, rt });
        if (!s.match) { s.wrong = seat; this.resolve(s); return; }
      }
      if (!s.wait.length) this.resolve(s);
      return;
    }
    return { err: '無法執行這個動作。' };
  },
  resolve(s) {
    const L = i => seatLabel(s.seats[i]);
    const c = C(s.pile[s.pile.length - 1]), n = s.pile.length;
    s.wait = [];
    let loser = null;
    if (s.match) {
      const rtOf = i => { const x = s.slaps.find(z => z.seat === i); return x ? x.rt : Infinity; };
      const order = range(1, s.seats.length).map(k => (s.call.seat + k) % s.seats.length);
      loser = order.reduce((b, i) => (rtOf(i) > rtOf(b) ? i : b), order[0]);

   玩家：加入成功就記下房號＋座號；同一個分頁重新整理會自動連回，關掉再開時首頁有「回到遊戲室」。
   主持人：遊戲室與牌局隨時存在這台裝置；同一個分頁重新整理會用同一個房號自動重開並接續牌局，
   關掉再開時首頁有「回到遊戲室」。主持人回來前，玩家的畫面會自動重連等待。 */

/* ---------- 示範對局：先在背景讓電腦玩完一整局並錄下每一步，再像影片一樣播放 ----------
   可以暫停、上一步／下一步、拖進度條；每一步都有「發生什麼＋為什麼」的解說 */
const DEMO_CAP = 4 * 60 * 1000;          // 一局示範最長 4 分鐘（遊戲內時間）
class DemoRecorder extends HostRunner {
  constructor(def, cfg, onPublish) { super(def, cfg, onPublish); this.vt = 0; this.capped = false; }
  /* 不真的等待：只累計遊戲內時間，播放時再照這個節奏 */
  sleep(ms) {
    if (this.state.over) return new Promise(() => {});
    this.vt += ms;
    if (this.vt > DEMO_CAP) this.capped = true;
    return new Promise(r => setTimeout(r, 0));
  }
  schedule(fn, ms) { const at = this.vt + ms; return setTimeout(() => { this.vt = Math.max(this.vt, at); fn(); }, Math.max(1, Math.round(ms / 100))); }
  publish() {
    if (this.capped && !this.state.over) this.def.finish(this.state, '示範到此結束。');
    super.publish();
  }
}
function recordDemo(meta) {
  const def = GAMES[meta.id];
  const opts = {}; meta.opts.forEach(o => { opts[o.key] = o.def; }); opts.time = '0';
  const n = meta.seats[0] === meta.seats[1] ? 2 : Math.min(4, meta.seats[1]);
  const cfg = { seats: range(0, n - 1).map(() => ({ ai: true, level: 'normal' })), opts, limit: meta.limit };
  return new Promise(res => {
    const frames = [];
    let rec = null, last = '';
    rec = new DemoRecorder(def, cfg, st => {
      const key = JSON.stringify({ ...st, seq: 0, wait: st.wait.map(w => ({ ...w, id: 0, remain: 0, deadline: 0 })) });
      if (key !== last) { last = key; frames.push({ t: rec ? rec.vt : 0, st }); }
      if (st.over) { rec.stop(); res(frames); }
    });
    rec.start();
  });
}
const DEMO_SPEEDS = [['0.35', '慢'], ['0.6', '中'], ['1.1', '快']];
async function showDemo(meta) {
  clearApp();
  const def = GAMES[meta.id];
  const main = gameScreen(meta, { onBack: () => { location.hash = ''; }, backLabel: '‹ 大廳', buttons: [h('span', { class: 'demo-tag' }, '示範對局')] });
  const game = main.parentNode; game.classList.add('demo');
  const narr = h('section', { class: 'demo-narr', 'aria-live': 'polite' }, h('p', { class: 'muted' }, '電腦正在準備一局示範…'));
  main.before(narr);
  let alive = true, timer = null;
  App.session = { kill: () => { alive = false; clearInterval(timer); if (view) view.destroy(); } };
  let view = null;
  const frames = await recordDemo(meta);
  if (!alive) return;
  /* 「一步」＝訊息換了一次；進度條、上一步／下一步都以步為單位 */
  const steps = [];
  frames.forEach((f, i) => { const n = f.st.msg ? f.st.msg.n : 0; if (!steps.length || steps[steps.length - 1].n !== n) steps.push({ n, i }); });
  const stepOf = i => { let k = 0; while (k + 1 < steps.length && steps[k + 1].i <= i) k++; return k; };
  view = new GameView(def, main, { mySeat: null, localSeats: new Set(), spectate: true, specTag: '示範對局', noOverModal: true, send: () => Promise.resolve({ ok: true }) });
  let cur = -1, t = 0, playing = true;
  const saved = Store.get('demoRate', '0.6');
  let rate = DEMO_SPEEDS.some(x => x[0] === saved) ? +saved : 0.6;
  const narrStep = h('span', { class: 'dn-step' }), narrMsg = h('div', { class: 'dn-msg' }), narrTeach = h('div', { class: 'dn-teach' });
  narr.replaceChildren(narrStep, h('div', { class: 'dn-body' }, narrMsg, narrTeach));
  const show = i => {
    i = clamp(i, 0, frames.length - 1);
    if (i === cur) return;
    cur = i;
    const st = frames[i].st, k = stepOf(i);
    view.update(st);
    narrStep.textContent = `第 ${k + 1} / ${steps.length} 步`;
    if (st.over) {
      narrMsg.innerHTML = `<b>${st.result.title}</b>`;
      narrTeach.innerHTML = st.result.note || '';
    } else {
      narrMsg.innerHTML = st.msg ? st.msg.html : '';
      narrTeach.innerHTML = def.teach ? def.teach(st) : '';
    }
    slider.value = String(k);
    playBtn.textContent = playing && i < frames.length - 1 ? '❚❚ 暫停' : '▶ 播放';
  };
  const go = k => { k = clamp(k, 0, steps.length - 1); playing = false; t = frames[steps[k].i].t; cur = -1; show(steps[k].i); };
  const playBtn = h('button', { type: 'button', class: 'btn primary small', onclick: () => {
    if (cur >= frames.length - 1) { t = 0; cur = -1; }
    playing = !playing; const i = cur; cur = -1; show(Math.max(0, i));
  } }, '❚❚ 暫停');
  const slider = h('input', { type: 'range', class: 'demo-range', min: '0', max: String(steps.length - 1), value: '0', step: '1', 'aria-label': '示範進度',
    oninput: e => go(+e.target.value) });
  const rateSeg = () => seg('播放速度', DEMO_SPEEDS, String(rate), v => { rate = +v; Store.set('demoRate', v); ctl.querySelector('.seg').replaceWith(rateSeg()); }, 'demo-rate');
  const ctl = h('div', { class: 'demo-ctl' },
    h('button', { type: 'button', class: 'btn small', title: '上一步', onclick: () => go(stepOf(cur) - 1) }, '‹ 上一步'),
    playBtn,
    h('button', { type: 'button', class: 'btn small', title: '下一步', onclick: () => go(stepOf(cur) + 1) }, '下一步 ›'),
    slider, rateSeg(),
    h('button', { type: 'button', class: 'btn ghost small', onclick: () => showDemo(meta) }, '換一局'));
  game.append(ctl);
  show(0);
  /* 照錄製時的遊戲節奏播放；rate 越小越慢 */
  timer = setInterval(() => {
    if (!alive || !playing) return;
    t += 100 * rate;
    let i = cur;
    while (i + 1 < frames.length && frames[i + 1].t <= t) i++;
    if (i !== cur) show(i);
    if (cur >= frames.length - 1) { playing = false; const j = cur; cur = -1; show(j); }
  }, 100);
}

function hostSession(S) {

/* 主持人的遊戲室與牌局存在這台裝置，重新整理或不小心關掉可以接續 */

  Store.set('hostSave', {
    t: Date.now(), role: myRole(), id: S.meta.id, code: S.code, phase: S.phase, total: S.total, limit: S.limit, opts: S.opts, hostPlays: S.hostPlays,
    seats: S.seats, game: S.game && S.game.last ? { cfg: S.game.cfg, state: S.game.last, pendingAuto: S.game.runner.pendingAuto || null, runId: S.game.runId } : null,
  });

}
async function restoreHost(save) {
  const meta = metaOf(save.id);
  clearApp();
  history.replaceState(null, '', location.pathname + '#g-' + meta.id);
  const S = { meta, phase: 'lobby', total: save.total, limit: save.limit, custom: false, opts: save.opts, room: null, code: null, game: null, hostPlays: save.hostPlays,
    seats: save.seats.map(st => (st.kind === 'human' && !st.local ? { ...st, online: false } : st)) };
  SET = S;
  App.session = hostSession(S);
  S.roomStatus = `正在重新開啟遊戲室 ${save.code}…（最多約 1 分鐘）`; S.roomError = false;
  renderLobby();
  if (!NET.available()) { S.roomStatus = '這個頁面無法建立遊戲室，請用網站網址開啟。'; S.roomError = true; renderLobby(); return; }
  try {
    const room = new RoomHost(hostHandlers());
    const code = await room.open(0, save.code);
    if (SET !== S) { room.close(true); return; }
    S.room = room; S.code = code; S.roomStatus = '';

  else { renderLobby(); saveHost(); }

/* ---------- 第二步：座位（等玩家加入、＋電腦）與房號 ---------- */
async function enterLobby() {
  const S = SET;
  Store.set('set.' + S.meta.id, { total: S.total, limit: S.limit, opts: S.opts, hostPlays: S.hostPlays });
  S.phase = 'lobby';
  S.seats = range(0, S.total - 1).map(i => (i === 0 && S.hostPlays ? hostSeat() : { kind: 'empty' }));
  await openRoom();
}
async function openRoom() {
  const S = SET;
  S.roomStatus = NET.available() ? '建立遊戲室中…' : '這個頁面不是從網址開啟的，無法建立遊戲室。請用網站網址（GitHub Pages）開啟。';
  S.roomError = !NET.available();
  renderLobby();
  if (!NET.available()) return;
  try {
    const room = new RoomHost(hostHandlers());
    const code = await room.open();
    if (SET !== S || S.phase !== 'lobby') { room.close(); return; }
    S.room = room; S.code = code; S.roomStatus = ''; S.roomError = false;
    saveHost();
  } catch (e) {
    S.roomStatus = `連不上配對服務（${e.type || e.message}）。請確認網路後再試一次。`; S.roomError = true;
  }
  renderLobby();
}
function aiNames(seats) { let k = 0; return seats.map(s => (s.kind === 'ai' ? AI_NAMES[k++ % AI_NAMES.length] : null)); }
function renderLobby() {
  const S = SET;

/* ---------- 線上遊戲室：主持人端 ---------- */
function hostHandlers() {
  return {
    onStatus: text => { if (SET) SET.roomStatus = text; },
    onHello: async (conn, msg) => {
      const S = SET; if (!S || !S.room) return;
      const cid = String(msg.cid || '').slice(0, 40);
      const name = String(msg.name || '').slice(0, 12), no = String(msg.no || '').trim().slice(0, 3), cls = String(msg.cls || '').trim().slice(0, 6);
      const same = s => (s.cls || '') === cls && s.no === no;
      const who = `${no} 號`;
      const holder = c => (c ? [...S.room.conns].find(x => x !== conn && x.cid === c) : null);
      /* 舊連線還活著嗎？玩家關掉頁面後馬上重開時，舊連線要過一陣子才會被判定斷線。
         活著的畫面每 3 秒會送一次訊號：等 4 秒沒動靜就是舊的，讓本人接手 */
      const stillLive = async c => {
        const x = holder(c);
        if (!x) return false;
        if (Date.now() - x.lastSeen > 7000) return false;
        const t = Date.now();
        await new Promise(r => setTimeout(r, 4000));
        return S.room && S.room.conns.has(x) && x.lastSeen > t;
      };
      const takeOver = c => { const x = holder(c); if (x) { x.cid = null; S.room.drop(x); } };
      const deny = text => { S.room.send(conn, { t: 'deny', msg: text }); setTimeout(() => S.room.drop(conn), 600); };
      if (S.phase === 'game' && S.game) {
        const cfgSeats = S.game.cfg.seats;
        let seat = cfgSeats.findIndex(s => s.cid === cid);
        /* 不小心關掉頁面的玩家：用同一個座號回到原本的座位 */
        if (seat < 0 && no) {
          const j = cfgSeats.findIndex(s => !s.ai && !s.local && same(s));
          if (j >= 0) {
            const old = cfgSeats[j].cid;
            if (await stillLive(old)) { deny(`${who}已經有人在遊戲中，請確認座號。`); return; }
            if (SET !== S || !S.game) return;
            takeOver(old);
            cfgSeats[j].cid = cid; S.game.runner.state.seats[j].cid = cid;
            const ls = S.seats.find(s => s.kind === 'human' && !s.local && same(s));
            if (ls) ls.cid = cid;
            seat = j;
          }
        }
        conn.cid = cid;
        S.room.send(conn, { t: 'welcome', seat: seat >= 0 ? seat : null, game: S.meta.id, code: S.code });
        if (seat >= 0) S.game.runner.setAway(seat, false);
        if (S.game.last) S.room.send(conn, { t: 'state', state: S.game.last });
        return;
      }
      if (S.phase !== 'lobby') { conn.cid = cid; S.room.send(conn, { t: 'welcome', seat: null, game: S.meta.id, code: S.code }); return; }
      if (!no) { deny('請輸入座號。'); return; }
      const dup = S.seats.find(s => s.kind === 'human' && same(s) && s.cid !== cid);
      if (dup) {
        /* 同班同座號的人已離線（例如關掉頁面）就讓他接回；還在線上就不能重複 */
        if (dup.local || await stillLive(dup.cid)) { deny(`${who}已經有人使用，請確認座號。`); return; }
        if (SET !== S || S.phase !== 'lobby') return;
        takeOver(dup.cid);
        dup.cid = cid;
      }
      conn.cid = cid;
      let i = S.seats.findIndex(s => s.cid === cid);
      if (i < 0) i = S.seats.findIndex(s => s.kind === 'empty');
      if (i >= 0) S.seats[i] = { kind: 'human', cid, name, no, cls, online: true };
      S.room.send(conn, { t: 'welcome', seat: i >= 0 ? i : null, game: S.meta.id, code: S.code });
      renderLobby(); hostBroadcastLobby();
    },
    onAct: (conn, msg) => {
      const S = SET; if (!S || S.phase !== 'game' || !S.game) return;
      const seat = S.game.cfg.seats.findIndex(s => s.cid === conn.cid);
      if (seat < 0) return;
      const r = S.game.runner.submit(seat, msg.action || {});
      if (r && r.err) S.room.send(conn, { t: 'err', msg: r.err });
    },
    onBack: conn => {
      const S = SET; if (!S || S.phase !== 'game' || !S.game) return;
      const seat = S.game.cfg.seats.findIndex(s => s.cid === conn.cid);
      if (seat >= 0) S.game.runner.reclaim(seat);
    },
    onGone: conn => {
      const S = SET; if (!S || !conn.cid) return;
      const still = [...S.room.conns].some(c => c.cid === conn.cid);
      if (still) return;
      if (S.phase === 'game' && S.game) {
        const seat = S.game.cfg.seats.findIndex(s => s.cid === conn.cid);
        if (seat >= 0) S.game.runner.setAway(seat, true);
        return;
      }
      const i = S.seats.findIndex(s => s.cid === conn.cid);
      if (i >= 0) { S.seats[i] = { kind: 'empty' }; renderLobby(); hostBroadcastLobby(); }
    },
  };
}
function lobbyPayload() {
  const S = SET, names = aiNames(S.seats);
  return { phase: S.phase, game: S.meta.id, code: S.code, total: S.total, limit: +S.limit || 0, opts: S.opts,
    seats: S.seats.map((st, i) => ({ kind: st.kind, name: st.kind === 'ai' ? names[i] : st.name, no: st.no, cls: st.cls, level: st.level, host: !!st.local })) };
}
function hostBroadcastLobby() { if (SET && SET.room && SET.code) SET.room.broadcast({ t: 'lobby', lobby: lobbyPayload() }); }
function hostNotifySeat(cid, seat) {
  if (!SET || !SET.room) return;

}
function hostStartGame(cfg, restore = null) {
  const S = SET, meta = S.meta, def = GAMES[meta.id];
  if (S.game) { S.game.runner.stop(); S.game.view.destroy(); }
  document.querySelectorAll('.modal-back').forEach(m => m.remove());
  S.phase = 'game';
  for (const c of S.room.conns) { const i = cfg.seats.findIndex(s => s.cid === c.cid); S.room.send(c, { t: 'welcome', seat: i >= 0 ? i : null, game: meta.id, code: S.code }); }
  const hostSeat = cfg.seats.findIndex(s => s.local);
  const main = gameScreen(meta, {
    room: S.code, backLabel: '‹ 遊戲室',
    onBack: () => confirmBox('回到遊戲室？', '這一局會中止，所有人回到座位畫面。', '回遊戲室', hostBackToLobby),
    buttons: [h('button', { class: 'gbtn', onclick: () => confirmBox('提早結算？', '以目前的狀況結算這一局。', '結算', () => S.game.runner.endNow()) }, '提早結算')],
  });
  const runId = restore ? restore.runId : Date.now().toString(36) + rand(1000);
  const view = new GameView(def, main, {
    mySeat: hostSeat >= 0 ? hostSeat : null, localSeats: new Set(hostSeat >= 0 ? [hostSeat] : []), spectate: hostSeat < 0,
    send: (seat, a) => Promise.resolve(S.game.runner.submit(seat, a)),
    reclaim: seat => S.game.runner.reclaim(seat),
    overActions: () => [
      { label: '結束遊戲室', ghost: true, onClick: () => { forgetHost(); if (S.room) S.room.close(); location.hash = ''; } },
      { label: '回遊戲室', ghost: true, onClick: hostBackToLobby },
      { label: '同一批人再玩一局', primary: true, onClick: () => hostStartGame(cfg) },
    ],
  });
  S.game = { cfg, runner: null, view, last: null, runId };
  S.game.runner = new HostRunner(def, cfg, st => {
    st.runId = runId;
    S.game.last = st;
    view.update(st);
    S.room.broadcast({ t: 'state', state: st });

  }, restore);
  S.game.runner.start();
}
function hostBackToLobby() {
  const S = SET;
  if (!S) return;
  if (S.game) { S.game.runner.stop(); S.game.view.destroy(); S.game = null; }
  document.querySelectorAll('.modal-back').forEach(m => m.remove());
  S.phase = 'lobby';
  S.seats.forEach(st => { if (st.kind === 'human' && !st.local) st.online = [...S.room.conns].some(c => c.cid === st.cid); });

/* ---------- 線上遊戲室：加入者端 ---------- */
let CL = null;
function showJoin(code, errText, auto = false) {
  clearApp();
  if (!myRole()) SS.set('role', 'student');
  const j = joinFields(code);
  j.status.textContent = NET.available() ? (errText || '') : '這個頁面目前無法連線：請用網站網址開啟（例如掃 QR code）。';
  App.root.append(h('div', { class: 'joinpage' },
    h('header', { class: 'gbar plain' }, h('button', { class: 'gbtn back', onclick: () => { location.hash = ''; } }, '‹ 大廳'), h('div', { class: 'gtitle' }, h('b', {}, '數學桌遊館'))),
    h('div', { class: 'panel joinform' }, h('h1', {}, '加入遊戲室'), j.form, j.status)));
  if (auto) j.form.requestSubmit();
  else setTimeout(() => (code && !j.noIn.value ? j.noIn : code ? j.form.querySelector('.btn') : j.codeIn).focus(), 30);
}
/* 不小心退出後一鍵回來（座號會自動帶入） */
function quickJoin(code, no) { if (no) saveNo(no); showJoin(code, '正在連回遊戲室…', true); }
async function joinRoom(code, hello) {
  const cl = { code, seat: null, view: null, runId: null, lobby: null, meta: null };
  cl.rc = new RoomClient(code, hello, { onMsg: msg => clientMsg(cl, msg), onStatus: (state, text) => clientStatus(state, text) });
  try { await cl.rc.start(); } catch (e) { cl.rc.close(); throw e; }
  CL = cl;
  Store.set('lastRoom', { code, no: hello.no, t: Date.now() });
  SS.set('inRoom', `${code}|${hello.no}`);
  App.session = { kill: () => { cl.rc.close(); if (cl.view) cl.view.destroy(); if (CL === cl) CL = null; } };
  if (!cl.view) clientWaiting(cl);
}
function clientMsg(cl, msg) {
  if (CL && CL !== cl) return;
  if (msg.t === 'welcome') { cl.seat = msg.seat; cl.meta = metaOf(msg.game); if (cl.view) { cl.view.seat = cl.seat; cl.view.o.localSeats = new Set(cl.seat != null ? [cl.seat] : []); } else clientWaiting(cl); return; }
  if (msg.t === 'lobby') {
    cl.lobby = msg.lobby; cl.meta = metaOf(msg.lobby.game);
    if (msg.lobby.phase === 'lobby') { if (cl.view) { cl.view.destroy(); cl.view = null; cl.runId = null; document.querySelectorAll('.modal-back').forEach(m => m.remove()); } clientWaiting(cl); }
    return;
  }
  if (msg.t === 'state') {
    const st = msg.state, meta = metaOf(st.game);
    if (!meta) return;
    if (!cl.view || cl.runId !== st.runId) {
      if (cl.view) cl.view.destroy();
      document.querySelectorAll('.modal-back').forEach(m => m.remove());
      cl.runId = st.runId; cl.meta = meta;
      const main = gameScreen(meta, { room: cl.code, backLabel: '‹ 離開', onBack: () => confirmBox('離開遊戲室？', '離開後由電腦代打你的座位；之後在首頁按「回到遊戲室」可以接回。', '離開', () => { location.hash = ''; }) });
      cl.view = new GameView(GAMES[meta.id], main, {
        mySeat: cl.seat, localSeats: new Set(cl.seat != null ? [cl.seat] : []),
        send: (seat, a) => { cl.rc.send({ t: 'act', action: a }); return Promise.resolve({ ok: true }); },
        reclaim: () => cl.rc.send({ t: 'back' }),
        overActions: () => [{ label: '離開遊戲室', ghost: true, onClick: () => { forgetRoom(); location.hash = ''; } }, { label: '等主持人開下一局', primary: true }],
      });
    }
    cl.view.update(st);
    return;
  }
  if (msg.t === 'err') { if (cl.view) cl.view.note('✗ ' + msg.msg, 'bad'); return; }
  if (msg.t === 'deny') {
    cl.rc.close(); if (cl.view) cl.view.destroy(); if (CL === cl) CL = null; App.session = null;
    SS.set('inRoom', null);
    showJoin(cl.code, '✗ ' + msg.msg);
    return;
  }
  if (msg.t === 'closed') {
    cl.rc.close(); forgetRoom();
    modal({ title: '遊戲室已關閉', body: h('p', {}, '主持人已經關閉遊戲室。'), dismissible: false, actions: [{ label: '回大廳', primary: true, onClick: () => { location.hash = ''; } }] });
  }
}
function clientStatus(state, text) {
  let bar = document.querySelector('.netbar');
  if (state === 'ok') { if (bar) bar.remove(); return; }
  if (!bar) { bar = h('div', { class: 'netbar', role: 'status' }); document.body.append(bar); }
  bar.textContent = text;
  bar.className = 'netbar' + (state === 'dead' ? ' dead' : '');
}
function clientWaiting(cl) {
  const lb = cl.lobby, meta = cl.meta;
  const seats = lb ? lb.seats.map((st, i) => h('div', { class: `seatrow kind-${st.kind}` + (i === cl.seat ? ' me' : ''), style: `--pc:${PLAYER_COLORS[i]}` },
    h('span', { class: 'seatno' }, meta && meta.id === 'king' ? TEAM_NAMES[i] : `${i + 1}`),
    h('div', { class: 'seatbody' },
      st.kind === 'empty' ? h('span', { class: 'seat-empty' }, '空位') : h('b', { class: 'seat-name' }, (st.no ? `${st.no}號${st.name ? ' ' + st.name : ''}` : st.name || (st.kind === 'ai' ? '電腦' : '玩家'))),
      st.kind === 'ai' ? h('em', { class: 'kind ai' }, `電腦·${LEVELS[st.level]}`) : st.kind === 'human' ? h('em', { class: 'kind human' }, st.host ? '主持人' : i === cl.seat ? '你' : '真人') : null))) : [];
  App.root.replaceChildren(h('div', { class: `setup s-${meta ? meta.series : 'treasure'}` },
    h('header', { class: `gbar s-${meta ? meta.series : 'treasure'}` }, h('button', { class: 'gbtn back', onclick: () => { forgetRoom(); location.hash = ''; } }, '‹ 離開'),
      h('div', { class: 'gtitle' }, h('span', { class: 'gseries' }, '線上遊戲室'), h('b', {}, meta ? meta.name : '連線中')),
      h('span', { class: 'roomchip' }, `房號 ${cl.code}`)),
    h('div', { class: 'setup-grid one' },
      h('section', { class: 'panel waitpanel' },
        h('h1', {}, cl.seat != null ? `你坐在第 ${cl.seat + 1} 個座位` : lb ? '座位已滿，你先觀戰' : '已連上遊戲室'),
        h('p', { class: 'setup-blurb' }, '等主持人開始，這個畫面保持開著就好。'),
        lb ? h('p', { class: 'setup-meta' }, `${meta && meta.limitLabel ? meta.limitLabel : '每手限時'}：${lb.limit ? lb.limit + ' 秒' : '不限時'}`) : null,
        h('div', { class: 'seatlist' }, seats),
        meta ? h('button', { class: 'btn', onclick: () => showRules(meta) }, `先看「${meta.name}」的規則`) : null))));
}

/* ---------- 路由 ---------- */
function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash.startsWith('g-') && metaOf(hash.slice(2))) { showSetup(metaOf(hash.slice(2))); return; }
  if (hash.startsWith('demo-') && metaOf(hash.slice(5))) { showDemo(metaOf(hash.slice(5))); return; }
  if (hash === 'join' || hash.startsWith('join=')) { if (!CL) showJoin(hash.slice(5)); return; }
  showHub();
}
App.root = document.getElementById('app');
window.addEventListener('hashchange', route);
(() => {
  const q = new URLSearchParams(location.search).get('room');
  if (q && /^\d{4}$/.test(q)) { history.replaceState(null, '', location.pathname + '#join'); showJoin(q); return; }
  /* 同一個分頁重新整理：主持人自動重開遊戲室、玩家自動連回 */
  const hs = hostSave();
  if (hs && SS.get('hosting') === hs.code) { restoreHost(hs); return; }
  const inRoom = SS.get('inRoom');
  if (inRoom && lastRoom()) { const [c, no] = inRoom.split('|'); quickJoin(c, no); return; }
  route();
})();

</script>
